## 1.1 — SOFTWARE Y TIPOS DE SOFTWARE

### Definición Integral
El software NO es solo código. Es el **conjunto completo** de piezas que hacen que un sistema exista y sea utilizable:

- Los programas que se ejecutan
- Las estructuras de datos sobre las que trabajan
- El contenido que el sistema genera o consume
- Los archivos de configuración que lo adaptan a un entorno
- La documentación técnica que explica cómo está construido
- La documentación de usuario que explica cómo se opera

**Consecuencia práctica crítica:** Cuando un proyecto dice "ya está el 100% del código", NO está el 100% del software. Falta configuración, datos de producción, manuales, documentación de arquitectura. Este desfasaje es una fuente clásica de proyectos que "parecían terminados" pero no lo estaban.

### El Papel Dual del Software

El software cumple simultáneamente DOS PAPELES (que pueden ocurrir en la misma pieza según desde dónde se la mire):

**1. COMO PRODUCTO:**
- Entrega información directa
- Transforma, administra, muestra o transmite datos que le sirven a un usuario final en un contexto puntual
- Ejemplo: Un sistema de facturación que usa un contador

**2. COMO VEHÍCULO:**
- Sirve de base para que otro software pueda existir y funcionar
- Ejemplos: sistemas operativos, bases de datos, runtimes, librerías

**Ejemplos con doble rol simultáneo:**
- **PostgreSQL:** Producto para el DBA que lo administra. Vehículo para todas las aplicaciones que corren encima.
- **Navegador web:** Producto para vos cuando navegás. Vehículo para todas las aplicaciones web que ejecutan dentro.
- **Sistema operativo:** Producto para el administrador que lo configura. Vehículo para todo lo que corre sobre la máquina.

**Punto clave para examen:** Dar un ejemplo de doble rol simultáneo demuestra que entendiste el concepto, no que memorizaste una lista.

### Software Genérico vs Software a Medida

La distinción fundamental está en **QUIÉN CONTROLA LOS REQUISITOS:**

**GENÉRICO:**
- Una organización desarrolla un producto y lo vende en el mercado abierto
- Esa organización decide qué funcionalidad entra y qué queda afuera en la próxima versión
- Ejemplo: Microsoft Office, Salesforce, SAP

**A MEDIDA:**
- Un cliente puntual encarga el desarrollo
- Es ese cliente el que determina los requisitos (típicamente formalizados en una ERS: Especificación de Requisitos de Software)
- Ejemplo: Sistema de gestión hospitalaria para el Hospital X

**Matiz importante:** La frontera se volvió muy difusa. Sistemas como SAP o Salesforce son técnicamente genéricos (se venden a cualquiera) pero admiten tal grado de configuración, parametrización y desarrollo de extensiones, que la implementación en un cliente concreto se parece a un proyecto a medida. Esto explica por qué el problema de gestionar requisitos no desaparece nunca.

## 1.2 — CARACTERÍSTICAS DEL SOFTWARE: LO QUE LO HACE DISTINTO

**Fuente:** Pressman, Capítulo 1. En la 5ª edición las tres características se enuncian así: "El software se desarrolla, no se fabrica en un sentido clásico", "El software no se estropea, pero se deteriora" y "Aunque la industria tiende a ensamblar componentes, la mayoría del software se construye a medida".

Estas tres características son el corazón conceptual de la primera unidad. Justifican por qué hace falta una ingeniería específica para el software y no alcanza con aplicar las ideas de la ingeniería industrial clásica.

### Característica 1: EL SOFTWARE SE DESARROLLA, NO SE MANUFACTURA

**En un producto físico:**
- Diseño = etapa de ingeniería (cara, requiere expertos)
- Fabricación = proceso mecánico repetitivo con costos marginales conocidos y economías de escala (barato por volumen)

**En software:**
- La segunda etapa prácticamente NO existe
- Fabricar la copia número mil es copiar un archivo, es gratis e instantáneo
- TODO el costo está concentrado en llegar a la PRIMERA COPIA CORRECTA

**Consecuencias:**

1. **La producción de software es HUMANO-INTENSIVA**
   - No hay línea de montaje que abarate el producto por volumen
   - Lo que hay son personas pensando
   - El mayor costo sigue siendo el salario de ingenieros

2. **La CALIDAD NO SE PUEDE "INSPECCIONAR AL FINAL" como en una fábrica**
   - Tiene que CONSTRUIRSE DURANTE TODO EL PROCESO
   - No se puede "rechazar" la última copia con defectos (todas son iguales)
   - Si falla la última, todas fallan

3. **Los procesos de desarrollo modernos incluyen PRUEBAS DESDE EL PRINCIPIO**
   - No como una etapa final
   - Porque el costo de un defecto crece exponencialmente con el tiempo
   - Un error detectado en diseño cuesta minutos; detectado en producción cuesta horas/días

---

### Característica 2: EL SOFTWARE NO SE DESGASTA, PERO SÍ SE DETERIORA

**Esta es la que más se pregunta en examen y la que más se responde mal.**

#### Hardware — Curva de la Bañera

```
Tasa de fallos
    |     ╱╲
    |    ╱  ╲___________╱╲
    |___╱________________╲___
         Inicio  Vida útil  Fin
```

- **Inicio:** Tasa ALTA (defectos de fabricación, "mortalidad infantil")
- **Medio:** Tasa BAJA y ESTABLE (vida útil)
- **Final:** Tasa SUBE (causas físicas reales: polvo, temperatura, vibración, corrosión, fatiga de materiales)

**El componente se GASTA. Se degrada la materia física.**

#### Software — Curva Diferente

**Premisa:** El software NO tiene materia que se degrade
- Un archivo binario que no se toca en veinte años es BIT POR BIT IDÉNTICO al primer día
- No hay óxido, no hay fatiga, no hay vibración
- **Por eso decimos que NO SE DESGASTA**

**PERO:** La curva real del software tampoco es una línea plana:

```
Tasa de fallos
    |     ╱╲
    |    ╱  ╲    ╱╲
    |___╱____╲__╱__╲___╱╲___
         C1  C2 C3 C4  C5
      Cambios introducidos
```

**El fenómeno:**
1. Arranca con tasa de fallos ALTA (defectos que se descubren a medida que se usa)
2. Baja y se estabiliza
3. **Cada vez que se introduce un cambio** (parche correctivo, funcionalidad nueva, adaptación a entorno distinto), la tasa de fallos SUBE HACIA ARRIBA
   - Razón: El cambio introduce defectos nuevos
4. Después baja nuevamente conforme se corrigen esos defectos, **PERO —punto CLAVE— NO vuelve a bajar hasta el nivel anterior**
   - Queda un poco MÁS ARRIBA
5. **Cambio tras cambio, ese piso se va ELEVANDO**
   - La estructura interna se va DEGRADANDO
   - El sistema se vuelve cada vez más frágil
   - Y más caro de mantener

**ESE ASCENSO PROGRESIVO DEL PISO = DETERIORO DEL SOFTWARE**

#### Respuesta Completa para Examen (3 movimientos):

1. **Diferencia física:** El software no tiene materia que se degrade
2. **Mecánica del deterioro:** Cada cambio introduce defectos y el piso sube
3. **Conclusión práctica:** El mantenimiento es la fase más larga y más cara del ciclo de vida. La mantenibilidad es un atributo de calidad, no un detalle.

---

### Característica 3: LA MAYORÍA DEL SOFTWARE SE SIGUE CONSTRUYENDO A MEDIDA

**En hardware:** Reutilizar es la norma desde siempre
- Nadie diseña su propio transistor
- Usa componentes estandarizados y probados
- Las economías de escala se logran mediante reuso masivo

**En software:** La reutilización sistemática es MUCHO más reciente e incompleta

**Qué SÍ se reutiliza:**
- Algoritmos de ordenamiento (biblioteca estándar)
- Funciones criptográficas (OpenSSL, etc.)
- Frameworks (React, Django, Spring)
- Contenedores y servicios en la nube (Docker, AWS)

**Qué NO se reutiliza:**
- La lógica de negocio específica de cada organización se sigue construyendo componente por componente
- Ahí es donde está el grueso del esfuerzo

**Matiz que suma en examen:** La reutilización NO es gratis. Reutilizar un componente implica:
- Entenderlo (requiere tiempo)
- Adaptarlo (requiere modificación)
- Confiar en él (depende de calidad)
- Quedar acoplado a su evolución (si el proveedor lo actualiza, hay que seguir)

Un equipo que reutiliza mal termina con más problemas que uno que escribió su propio código. Por eso la reutilización efectiva es una **DECISIÓN DE ARQUITECTURA**, no una decisión táctica de un programador. Conecta directamente con lo que el Proceso Unificado dice sobre el rol del arquitecto.

## 1.3 — ATRIBUTOS DE UN BUEN SOFTWARE

**Fuente:** Sommerville, Capítulo 1 (Figura 1.5 "Atributos esenciales de un buen software": mantenibilidad, confiabilidad, eficiencia y usabilidad). En los puntos clave del capítulo, Sommerville llama al cuarto atributo **aceptabilidad**: el software debe ser aceptable (comprensible, usable y compatible) para los usuarios para los que se diseñó.

### Distinción Fundamental

- **Requisitos funcionales** = QUÉ hace el sistema
  - Ejemplo: "el sistema debe permitir registrar un pedido"

- **Atributos de calidad** = QUÉ TAN BIEN lo hace
  - Ejemplo: "el sistema debe registrar un pedido en menos de dos segundos con mil usuarios concurrentes"

### Los Cuatro Atributos Esenciales

#### 1. MANTENIBILIDAD
- La capacidad del software de evolucionar sin que cada cambio sea una tortura
- Conecta directamente con lo que vimos sobre deterioro
- Probablemente el más importante a largo plazo
- Inversión hoy en código limpio = menos costo mañana en cambios

#### 2. CONFIABILIDAD
Un paraguas que incluye:
- **Fiabilidad:** Que el sistema haga lo que promete (hacer el trabajo correcto)
- **Protección:** Que un fallo no cause daño físico o económico (minimizar impacto)
- **Seguridad:** Que resista uso malicioso (defender contra ataques)

#### 3. EFICIENCIA
- No desperdiciar recursos
- Tiempo de respuesta
- Memoria
- Procesamiento
- Ancho de banda
- Energía

#### 4. USABILIDAD
- Que el usuario para el que fue pensado el sistema pueda usarlo sin sufrir
- IMPORTANTE: La usabilidad siempre se mide contra un PERFIL DE USUARIO CONCRETO, no en abstracto
- Diferente para expertos vs principiantes
- Diferente para técnicos vs usuarios de negocio

### LOS ATRIBUTOS COMPITEN ENTRE SÍ

**Punto crítico que puede aparecer en examen:** Estos atributos NO se maximizan todos simultáneamente. De hecho, COMPITEN:

- **Más seguridad** → más pasos de autenticación, más validaciones, más fricción → **menos usabilidad**
- **Más eficiencia** → código optimizado, estructuras poco obvias, trucos de bajo nivel → **menos mantenibilidad**
- **Más mantenibilidad** → capas de abstracción e indirección → cuestan ciclos de procesamiento → **menos eficiencia**

**UN INGENIERO DE SOFTWARE NO MAXIMIZA LOS CUATRO: LOS BALANCEA según lo que el sistema concreto necesita.**

#### Ejemplos de Priorización:

- **Marcapasos:** Confiabilidad por encima de todo lo demás (la vida de una persona depende de que funcione)
- **Red social:** Usabilidad y escalabilidad (millones de usuarios, cambios frecuentes)
- **Sistema bancario:** Seguridad y trazabilidad (dinero en juego, auditoría regulatoria)
- **Aplicación web moderna:** Entregas frecuentes, usabilidad, performance

**Poder decir esto, con un ejemplo concreto, demuestra criterio ingenieril y no solo memoria.**

## 1.4 — CATEGORÍAS DEL SOFTWARE

La lista de categorías es fácil de memorizar y por eso poco valiosa por sí sola. Lo valioso es tener un **EJEMPLO PROPIO de cada una** y entender **POR QUÉ las fronteras importan**.

### 1. SOFTWARE DE SISTEMAS
- Sirve a otro software antes que a un usuario final
- Ejemplos: núcleo de Linux, controlador de impresora, compilador de Java
- **Característica:** Impacta la capacidad de otros sistemas

### 2. SOFTWARE DE APLICACIÓN
- Resuelve una necesidad concreta de negocio
- Ejemplos: sistema de facturación, sistema de gestión de historias clínicas, CRM
- **Característica:** Directamente usado por usuarios finales para un propósito de negocio

### 3. SOFTWARE CIENTÍFICO Y DE INGENIERÍA
- Se caracteriza por uso intensivo de cálculo numérico sobre modelos matemáticos
- Ejemplos: simulación de fluidos, cálculo estructural, modelos climáticos
- **Característica:** Algoritmos complejos, precisión crítica, volumen de datos masivo

### 4. SOFTWARE EMPOTRADO
- Vive dentro de un dispositivo y suele tener restricciones fuertes de memoria, energía y tiempo real
- Ejemplos: firmware de un microondas, centralita de un auto, marcapasos
- **Característica:** Recursos limitados, deadline estrictos, tolerancia a fallos muy baja

### 5. SOFTWARE DE LÍNEA DE PRODUCTOS
- Base común que se adapta a variantes de un mismo dominio
- Típicamente activando o desactivando módulos
- Ejemplo: un ERP que se configura distinto para una farmacia que para una metalúrgica
- **Característica:** Reutilización masiva de componentes comunes

### 6. SOFTWARE DE WEB
- Todo lo que se ejecuta sobre infraestructura de red
- Integra datos corporativos con interfaces accesibles desde un navegador
- Ejemplos: Gmail, Salesforce, aplicaciones cloud
- **Característica:** Acceso remoto, múltiples plataformas, escalabilidad

### 7. SOFTWARE DE INTELIGENCIA ARTIFICIAL
- Resuelve problemas para los que no existe un algoritmo directo
- Va desde sistemas expertos basados en reglas hasta modelos entrenados con datos (deep learning)
- Ejemplos: chatbots, sistemas de recomendación, visión por computadora
- **Característica:** Salida probabilística, requiere datos de entrenamiento

### Categorías NO son Excluyentes

**Para pensar en examen:** Estas categorías NO son excluyentes. El software de un auto moderno es:
- **Empotrado** (vive en el vehículo)
- Tiene componentes de **inteligencia artificial** (asistencia de conducción, reconocimiento de patrones)
- Se conecta a la nube (**aspectos web**)
- Se desarrolla como **línea de productos** (mismo software base va a distintos modelos)

**Reconocer eso demuestra comprensión real de las categorías, no solo memorización.**

### Nota sobre las Ediciones de Pressman

La planificación de la cátedra pide la **7ª edición** de Pressman, que presenta las **7 categorías** de arriba.

La **5ª edición** (que también tenés en PDF, además de la 7ª) presenta **8 categorías**: software de sistemas, software de tiempo real, software de gestión, software de ingeniería y científico, software empotrado, software de computadoras personales, software basado en Web y software de inteligencia artificial.

## 1.5 — EL SOFTWARE HEREDADO (LEGACY)

El software heredado merece atención aparte porque es el **problema cotidiano de casi cualquier organización real** y porque encierra una **PARADOJA que da para una excelente respuesta de examen**.

### Definición

**¿QUÉ ES?**
- Sistemas viejos
- Generalmente construidos con tecnología que ya no es corriente (COBOL, mainframes, etc.)
- Diseño interno difícil de entender
- Documentación pobre o inexistente
- Muchas veces sin las personas que los escribieron
- Soportan procesos críticos del negocio

**SEGÚN ESTÁNDARES MODERNOS DE CALIDAD:** Tienen baja calidad.

### LA PARADOJA

**Y sin embargo, sostienen procesos críticos del negocio y funcionan de manera CONFIABLE**, porque llevan años o décadas de defectos corregidos en producción. Es como un edificio viejo pero sólido: nadie entiende todos los detalles de su estructura, pero funciona.

### LA TENSIÓN

**Dos fuerzas opuestas:**

1. **Nadie quiere tocarlos** porque cualquier cambio puede romper algo que nadie entiende del todo (riesgo altísimo)
2. **A la vez, tienen que cambiar**, porque:
   - El negocio evoluciona
   - La legislación cambia
   - Aparecen requisitos de integración nuevos
   - Las plataformas sobre las que corren se van discontinuando
   - Los proveedores dejan de soportarlas

**LA TENSIÓN ENTRE "NO TOQUES LO QUE FUNCIONA" Y "TIENE QUE EVOLUCIONAR IGUAL" es la esencia del mantenimiento de software heredado.**

### Decisiones Estratégicas

LAS DECISIONES sobre estos sistemas —**reemplazar, reescribir, envolver con una capa nueva, o mantener y convivir**— son **DECISIONES ESTRATÉGICAS, no técnicas**.

**Cuándo cada una:**
- **Reemplazar:** Si el software es verdaderamente irrecuperable y existe una alternativa en el mercado
- **Reescribir:** Si la lógica de negocio sigue siendo válida pero la implementación es insostenible
- **Envolver:** Si funciona bien pero hay que adaptarlo a interfaces nuevas (web, APIs modernas)
- **Mantener y convivir:** Si sigue cumpliendo su función y el costo de cambio es prohibitivo

## 1.6 — PROBLEMÁTICAS EN EL DESARROLLO: LA CRISIS DEL SOFTWARE

### El Problema (Años 60s-70s)

Durante los años sesenta, a medida que los proyectos crecían en tamaño y ambición, se hizo evidente un patrón sistemático:

- Los sistemas se entregaban **TARDE**
- Costaban **MUCHO MÁS** de lo presupuestado
- **NO hacían lo que el cliente realmente necesitaba**
- Eran difíciles de modificar
- Tenían calidad **POBRE**

Este conjunto de síntomas se conoció como **LA CRISIS DEL SOFTWARE**.

### Lo Que Pasaba Realmente

**IMPORTANTE:** La crisis NO fue un evento puntual sino la **CONSTATACIÓN DE UN DESFASAJE:**

- La capacidad del hardware **crecía exponencialmente** y habilitaba sistemas cada vez más ambiciosos
- La capacidad de construir software confiable **crecía mucho más despacio**, porque dependía de prácticas artesanales
- **El hardware avanzaba, pero la ingeniería de software no.**

### La Respuesta

**En 1968**, en una conferencia auspiciada por la **OTAN**, se propuso formalmente el término **INGENIERÍA DE SOFTWARE** para nombrar la respuesta:

**Aplicar al desarrollo del software el tipo de rigor que otras ingenierías ya aplicaban a sus productos.**

**Fuente de este relato:** Sommerville, Capítulo 1, p.4 ("la noción de ingeniería del software fue propuesta inicialmente en 1968 en una conferencia para discutir lo que en ese entonces se llamó la «crisis del software»").

### "Aflicción Crónica" (Pressman, 5ta edición)

Pressman discute si "crisis" sigue siendo el término apropiado, dados los grandes éxitos de la industria. Propone hablar de una **aflicción crónica**: "algo que causa pena o desastre" y que es "muy duradero o que reaparece con frecuencia, continuando indefinidamente". Es más preciso que "crisis" para describir los problemas que la industria viene aguantando.

**Nota de edición:** esta cita textual está en la 5ta edición de Pressman (Cap.1, p.8); no aparece con esas palabras en la 7ma edición, que es la de bibliografía oficial de la cátedra.

## 1.7 — LOS MITOS DEL SOFTWARE

**Fuente:** Pressman, 5ta edición, Capítulo 1, p.8: "Muchas de las causas de la crisis del software se pueden encontrar en una **mitología** que surge durante los primeros años del desarrollo del software". Por eso los mitos se estudian junto con las problemáticas del desarrollo. (Esta cita textual no aparece así en la 7ma edición, la oficial de la cátedra; el contenido de los tres grupos de mitos sí está presente en ambas ediciones.)

Los mitos son un tema clásico de examen, generalmente en forma de "clasifique el siguiente enunciado" o "diga si es verdadero o falso y justifique".

**La clasificación es en TRES GRUPOS según quién los sostiene.** Lo importante es entender la **RAÍZ COMÚN de cada grupo**, porque eso te permite clasificar un mito que nunca viste.

### MITOS DE GESTIÓN

Nacen de la presión por cumplir plazos y presupuestos. Suelen consistir en buscar un **ATAJO que sustituya al trabajo**.

#### MITO 1: "Un manual de estándares completo garantiza que el equipo construya bien"

**REALIDAD:** Un estándar que nadie lee o que no está actualizado no sirve de nada.
- El estándar es una herramienta, no una pócima mágica
- Requiere capacitación, refuerzo y auditoría
- Sin eso, termina siendo papel perdido

#### MITO 2: "Si un proyecto está atrasado, agregar programadores lo acelera"

**REALIDAD:** Lo atrasa MÁS.

**Razones:**
1. Las personas nuevas necesitan que alguien del equipo deje de producir para enseñarles (productividad neta negativa inicialmente)
2. Aumentar la cantidad de personas aumenta **CUADRÁTICAMENTE** los canales de comunicación que hay que coordinar
   - 2 personas: 1 canal
   - 3 personas: 3 canales
   - 4 personas: 6 canales
   - N personas: N(N-1)/2 canales

**Esta observación se conoce como LA LEY DE BROOKS**, viene de su libro "The Mythical Man-Month" (1975) y citarla suma puntos en un examen.

---

### MITOS DE CLIENTE

Nacen de **NO ENTENDER el costo real de la ambigüedad y del cambio tardío**.

#### MITO 1: "Un enunciado general de los objetivos alcanza para empezar a programar; los detalles se completan sobre la marcha"

**REALIDAD:** Una definición vaga es la **PRINCIPAL CAUSA** de sistemas que fallan al entregarse.

- El equipo construyó exactamente lo que se le dijo
- Y no era lo que se necesitaba
- El desfasaje solo se descubre cuando el cliente ve el sistema terminado (demasiado tarde para cambios grandes)

#### MITO 2: "Los cambios son baratos porque el software es flexible"

**REALIDAD:** Un cambio de requisitos **DESPUÉS de la entrega puede costar ENTRE 50 Y 100 VECES MÁS** que el mismo cambio durante captura de requisitos.

**Razones:**
- Hay que rehacer análisis
- Hay que rehacer diseño
- Hay que rehacer código
- Hay que rehacer pruebas
- Hay que rehacer documentación
- Y hay datos en producción que migrar

---

### MITOS DE DESARROLLADOR

Nacen de **SUBESTIMAR todo lo que viene después de que el código anda**.

#### MITO 1: "Cuando el programa funciona el trabajo está terminado"

**REALIDAD:** Entre el **50% y el 70% del esfuerzo total** de un sistema se gasta **DESPUÉS de la primera entrega**.

- Inicialmente: correcciones de defectos descubiertos en uso
- A largo plazo: mantenimiento y evolución

#### MITO 2: "La documentación es un lujo prescindible que resta tiempo de programar"

**REALIDAD:** Es precisamente lo que hace posible el mantenimiento y lo que evita que el sistema se vuelva legacy prematuramente.

#### MITO 3: "Lo único entregable es el código ejecutable"

**REALIDAD:** El modelo, la documentación y las pruebas también son **PRODUCTOS del trabajo**.

- Cliente paga por sistema completo, no solo por ejecutable
- Falta de documentación = imposibilidad de mantener
- Falta de casos de prueba = no hay cobertura

## 1.8 — INGENIERÍA DE SOFTWARE: DEFINICIÓN IEEE

### La Definición

"La aplicación de un enfoque **SISTEMÁTICO, DISCIPLINADO y CUANTIFICABLE** al desarrollo, operación y **MANTENIMIENTO** del software"

### Las Tres Palabras Clave

#### 1. SISTEMÁTICO
- Hay un método, no improvisación
- Cada paso sigue de forma lógica al anterior
- Se puede documentar, enseñar y replicar

#### 2. DISCIPLINADO
- Ese método se sigue aunque haya presión de tiempo
- **CRÍTICO:** Este es el punto que más se viola en proyectos reales
- Es justamente cuando la tentación de saltarlo es más fuerte (una entrega urgente)
- Una ingeniería "de verdad" se mantiene disciplinada bajo presión

#### 3. CUANTIFICABLE (la palabra que más se pasa por alto)
- Se puede medir
- Si no podés medir cuánto tardás, cuántos defectos tenés y cuánto cuesta un cambio, **no estás haciendo ingeniería, estás haciendo artesanía prolija**
- La medición permite mejorar: no se puede mejorar lo que no se mide

### Nota sobre Operación y Mantenimiento

La definición menciona explícitamente la **OPERACIÓN Y EL MANTENIMIENTO**, no solo el desarrollo.

**El compromiso de la disciplina abarca TODO el ciclo de vida, no solo la fase de construcción.**

## 1.9 — CONCEPTOS: PROCESO, MÉTODOS Y HERRAMIENTAS

Tanto Pressman como la cátedra coinciden en que la ingeniería de software está formada por **TRES ELEMENTOS que se apoyan unos en otros:**

### 1. PROCESO

El conjunto de **actividades, acciones y tareas** que se ejecutan para crear un producto de trabajo.

**Es el aglutinante** que une las capas de la tecnología, la base sobre la que se gestionan los proyectos, y el contexto en el que se aplican los métodos, se generan los productos de trabajo, se fijan puntos de referencia y se asegura la calidad.

**Responde:** ¿En qué orden ocurren las cosas? ¿Quién es responsable de qué? ¿Cuál es el flujo?

### 2. MÉTODOS

Los **enfoques estructurados** para el desarrollo:
- Modelos
- Notaciones
- Reglas
- Sugerencias de diseño
- Guías de proceso

Aportan la **experiencia técnica concreta**: comunicación, análisis de requerimientos, modelado, construcción, pruebas y soporte.

**Responde:** ¿Cómo se hace exactamente cada actividad?

### 3. HERRAMIENTAS

El **soporte automatizado o semiautomatizado** al proceso y a los métodos:
- Editores (de código, de diagramas)
- Verificadores de reglas
- Generadores de informes
- Generadores de código
- Sistemas CASE (Computer-Aided Software Engineering)

**Responde:** ¿Con qué se hacen las cosas más eficientemente?

### CAPA PREVIA (Implícita pero Crítica)

Toda la estructura se apoya en un **COMPROMISO ORGANIZACIONAL CON LA CALIDAD**.

**Sin esto**, ni el proceso, ni los métodos, ni las herramientas alcanzan por sí solos.

Esta idea conecta con la **MEJORA CONTINUA** que se desarrolla después: filosofías como la Administración Total de la Calidad o Six Sigma son justamente las que alimentan ese compromiso de base.

**Fuente:** Pressman, Capítulo 1, §1.3 "Ingeniería de software": "La ingeniería del software es una **tecnología multicapa**… cualquier enfoque de ingeniería debe apoyarse sobre un **compromiso de organización de calidad**". Las capas, de abajo hacia arriba: enfoque de calidad, proceso, métodos y herramientas.

## 1.10 — RETOS A ENFRENTAR

Sommerville identifica **TRES GRANDES RETOS** que la disciplina enfrenta hoy:

### RETO 1: LA HETEROGENEIDAD

**El Problema:**
Cada vez más se exige que los sistemas operen como **sistemas distribuidos** en redes con:
- Distintos tipos de computadoras (desktop, móvil, IoT, cloud)
- Distintos sistemas de soporte (Windows, Linux, macOS, Android, iOS)
- Frecuentemente integran **software nuevo con sistemas heredados** escritos en lenguajes distintos

**El Reto:**
Construir software **confiable y lo bastante flexible** como para adecuarse a esa heterogeneidad.

**Ejemplo:** Una aplicación debe funcionar igual en navegador, app móvil, o API REST que consulten aplicaciones legacy en mainframe.

### RETO 2: LA ENTREGA

**El Problema:**
- Las técnicas **tradicionales consumen tiempo** para producir software de calidad
- Los negocios actuales **necesitan capacidad de respuesta rápida**
- El mercado es más volátil, los requisitos cambian, la competencia es feroz

**El Reto:**
Reducir los tiempos de entrega **sin comprometer la calidad**.

**Ejemplo:** Un startup necesita iterar el producto cada dos semanas, pero no puede permitirse defectos que romplan el negocio.

### RETO 3: LA CONFIANZA

**El Problema:**
El software está presente en **todos los aspectos de la vida cotidiana**, de forma especialmente crítica en los **sistemas remotos accedidos vía web**.

**El Reto:**
Desarrollar técnicas que **demuestren** que se puede confiar en ese software.

**Ejemplo:** Un sistema bancario web debe poder certificar que es seguro, confiable y que no perderá ni deformará transacciones.

### La Interconexión de los Retos

**CONEXIÓN IMPORTANTE:** Estos tres retos **NO son independientes** entre sí.

Muchas veces hace falta:
- Hacer cambios **rápidos** (entrega) 
- A sistemas **heredados** (heterogeneidad) 
- Para dotarlos de una interfaz de servicio web **confiable** (confianza)

Son tres proyecciones del mismo problema: **gestionar la complejidad del software moderno**.

### Por Qué Estos Retos Son Particularmente Difíciles

- El software no es tangible, lo que dificulta medir su avance
- Existe la percepción de que es fácil de modificar, lo que genera pedidos de cambio continuos
- Su producción es humano-intensiva, así que el mayor costo está ligado al esfuerzo de ingeniería (no se puede reducir por pura eficiencia técnica)

## 1.11 — INVOLUCRADOS EN UN SISTEMA DE INFORMACIÓN Y PAPEL DEL ANALISTA DE SISTEMAS

**Fuente:** Whitten y Bentley, *Análisis de Sistemas: diseño y métodos*, 7ª ed., Capítulo 1 ("Los jugadores y los involucrados en el sistema").

### Qué es un Involucrado

**Involucrado:** toda persona que tiene interés en un sistema de información existente o propuesto. Pueden ser trabajadores técnicos y no técnicos, internos o externos.

### Siete Tipos de Sistemas de Información

Según Whitten y Bentley, los sistemas de información suelen clasificarse en:

1. **Sistemas de procesamiento de transacciones (TPS)**
2. **Sistemas de información administrativa (MIS)**
3. **Sistemas de soporte de decisiones (DSS)**
4. **Sistemas de información ejecutiva (EIS)**
5. **Sistemas expertos**
6. **Sistemas de comunicación y colaboración**
7. **Sistemas de automatización de oficina**

### Los Involucrados en un Sistema de Información

Cada grupo ve el sistema desde una perspectiva distinta:

- **PROPIETARIOS DEL SISTEMA:** pagan para que el sistema sea construido y operado, y establecen la visión y las prioridades. Suelen venir de las filas de los administradores.
- **USUARIOS DEL SISTEMA:** definen los requerimientos de negocios y las expectativas del sistema. Son la vasta mayoría de los trabajadores de la información (internos y, gracias a Internet, también externos).
- **DISEÑADORES DEL SISTEMA:** traducen los requerimientos de negocios en una solución técnica factible (diseñan bases de datos, entradas, salidas, redes, etc.).
- **CONSTRUCTORES DEL SISTEMA:** construyen, implantan y mantienen el sistema, de acuerdo con las especificaciones de diseño.
- **ANALISTAS DE SISTEMAS:** facilitan el desarrollo; coordinan los esfuerzos de propietarios, usuarios, diseñadores y constructores. Con frecuencia pueden jugar uno de esos papeles también.
- **PROVEEDORES DE SERVICIO EXTERNO (ESP):** cualquier papel de involucrado puede ser desempeñado por un trabajador externo contratado por su experiencia en un proyecto específico.
- **ADMINISTRADOR DE PROYECTOS:** coordina y dirige el proyecto.

### El Papel del Analista de Sistemas

**Analista de sistemas:** especialista que estudia los problemas y necesidades de una organización para determinar la forma en que las personas, los datos, los procesos y la tecnología de la información pueden lograr óptimamente mejoras para la empresa.

- Entiende tanto de **negocios** como de **cómputo**
- Su papel **se superpone intencionalmente** con el de todos los demás involucrados: cubre la brecha entre quienes no son técnicos (propietarios, usuarios) y quienes sí lo son (diseñadores, constructores)
- Para propietarios y usuarios: **identifica y valida** problemas y necesidades del negocio
- Para diseñadores y constructores: se asegura de que la **solución técnica satisfaga las necesidades** del negocio
- Es básicamente un **solucionador de problemas**. "Problema" incluye:
  - Problemas reales o anticipados que requieren acción correctiva
  - Oportunidades para mejorar una situación aunque nadie se queje
  - Directivas para cambiar una situación

### Habilidades Requeridas por el Analista de Sistemas

Además de las habilidades de análisis y diseño de sistemas, un analista debe desarrollar:

1. **Conocimiento del trabajo de las tecnologías de la información**
2. **Experiencia en programación de computadoras**
3. **Conocimiento general de procesos y terminología de negocios**
4. **Habilidades generales de solución de problemas**
5. **Buenas habilidades de comunicación interpersonal** (oral y escrita)
6. **Buenas habilidades de relaciones interpersonales**
7. **Flexibilidad y adaptabilidad** (no hay dos proyectos iguales)
8. **Carácter y ética** (accede a información sensible y confidencial)

**Punto clave para examen:** Según Bentley, sus habilidades de comunicación, y no las técnicas, suelen ser el factor más determinante para el éxito de un analista.

### Los Diez Mandamientos de la Ética de Cómputo

Whitten y Bentley ilustran la habilidad "carácter y ética" con esta lista del Instituto de Ética de Cómputo:

1. No usarás una computadora para dañar a otros.
2. No interferirás con el trabajo informático de otros.
3. No espiarás los archivos de otros.
4. No usarás una computadora para robar.
5. No usarás una computadora para dar falso testimonio.
6. No copiarás ni usarás software propietario sin pagarlo.
7. No usarás los recursos informáticos de otros sin autorización.
8. No te apropiarás de la producción intelectual ajena.
9. Pensarás en las consecuencias sociales de lo que programás.
10. Usarás la computadora de un modo que asegure consideración y respeto hacia los demás.

## 1.12 — CONCEPTO DE MODELO E IMPORTANCIA DE MODELAR

**Fuente:** Booch, Rumbaugh y Jacobson, *El Lenguaje Unificado de Modelado*, Capítulo 1 ("¿Por qué modelamos?").

### Razón de Fondo

**Una sola:** Construimos modelos para **COMPRENDER MEJOR el sistema que estamos desarrollando**.

No es un ejercicio académico; es una herramienta para pensar.

### Cuatro Objetivos Concretos

1. **Ayudan a VISUALIZAR** cómo es (o cómo queremos que sea) un sistema
   - Dibujar un diagrama aclara cosas que mil palabras no logran
   - La visualización enciende ideas

2. **Permiten ESPECIFICAR** su estructura o comportamiento
   - Precisar qué va dónde, cómo interactúan las partes
   - Comunicar con exactitud a otros equipos

3. **Proporcionan una GUÍA para construirlo**
   - El modelo es la "receta" para implementación
   - Reduce decisiones ad-hoc durante el código

4. **DOCUMENTAN** las decisiones tomadas
   - Evita que dependan solo de memoria (y de la gente que las tomó)
   - Futuro desarrollador puede entender "por qué" se hizo así

### Qué es un Modelo

Una **SIMPLIFICACIÓN DE LA REALIDAD** que se queda con lo **RELEVANTE para el propósito** con el que se lo construye, dejando afuera todo lo demás.

**Ejemplo:**
- Para un mapa vial, es relevante dónde están las rutas pero no dónde está cada casa
- Para un plano de arquitecto, son relevantes las dimensiones pero no quién vive dónde
- Para un diagrama UML, es relevante qué datos tiene una Persona pero no su historial médico

### Los Cuatro Principios del Modelado

#### Principio 1: Elección de Modelos Condiciona el Pensamiento

La elección de **QUÉ MODELOS CREAR** influye profundamente en:
- **CÓMO se acomete un problema**
- **CÓMO se da forma a la solución**

El modelo NO es neutral; condiciona qué preguntas se hacen.

**Ejemplo:**
- Si modelas el dominio con clases, pensás en términos de objetos y responsabilidades
- Si modelas con procesos, pensás en términos de flujos y dependencias
- Cada uno lleva a arquitecturas distintas

#### Principio 2: Múltiples Niveles de Precisión

Todo modelo puede expresarse en **DISTINTOS NIVELES DE PRECISIÓN**.

A veces conviene grueso (visión rápida), otras hace falta detalle.

**Ningún nivel es "correcto" en abstracto:**
- Diagrama grueso al inicio del proyecto
- Detallado cuando el equipo va a implementar

#### Principio 3: Ligados a la Realidad

Los mejores modelos están **LIGADOS A LA REALIDAD**.

Uno que se aleja mucho deja de ser útil, por más prolijo que se vea.

**Peligro:** Crear modelos complejos pero desconectados del problema real.

#### Principio 4: Un Único Modelo NO es Suficiente

**Cualquier sistema no trivial se aborda mejor con un pequeño CONJUNTO DE MODELOS casi independientes, cada uno mostrando una vista distinta.**

Ejemplos:
- Modelo de casos de uso (vista funcional)
- Diagrama de clases (vista estática)
- Diagrama de secuencia (vista dinámica)
- Modelo de despliegue (vista física)

Cada modelo responde una pregunta diferente.

## 1.13 — PROCESO DE NEGOCIO, REGLAS DE NEGOCIO E INTRODUCCIÓN A BPMN

**Fuentes:** Pressman, Capítulo "Mantenimiento y Reingeniería" (Capítulo 29 en la 7ª edición, la oficial; Capítulo 30 en la 5ª) — procesos de negocio; Whitten y Bentley (reglas de negocio); planificación de la cátedra (Introducción a BPMN).

### Concepto de Proceso de Negocio

Un **proceso de negocio** es "un conjunto de tareas lógicamente relacionadas que se llevan a cabo para obtener un determinado resultado de negocio" (Pressman).

- Dentro del proceso se combinan **personas, equipos, recursos materiales y procedimientos** de negocio para producir un resultado concreto
- Ejemplos: diseñar un nuevo producto, adquirir servicios, contratar un empleado, pagar a proveedores
- Cada proceso de negocio tiene un **cliente bien definido** (la persona o grupo que recibe el resultado)
- Los procesos **cruzan los límites organizativos**: requieren que participen distintos grupos de la organización

### La Jerarquía del Negocio

Según Pressman, el negocio se segmenta así:

```
El negocio
   → sistemas de negocio (funciones de negocio)
        → procesos de negocio
             → subprocesos de negocio
```

### Actividades del Proceso

Las **actividades** son las tareas lógicamente relacionadas que forman el proceso. Cada una transforma entradas en salidas y aporta al resultado de negocio.

### Reglas de Negocio

Las **reglas de negocio** especifican **políticas y procedimientos del negocio que el nuevo sistema debe obedecer** (Whitten y Bentley).

- Ejemplos: cómo se calculan los cargos de envío, las condiciones para otorgar un crédito
- Deben capturarse durante el análisis porque restringen lo que el sistema puede hacer

### Por Qué Modelar el Negocio

Modelar los procesos de negocio da una **visión más clara de los requerimientos** del sistema de información que les servirá de soporte (objetivo explícito de la planificación de la cátedra).

- Conecta con el Proceso Unificado: el **modelo del negocio** es una de las formas de comprender el contexto del sistema (ver Unidad IV)

### Introducción a BPMN

**Introducción a BPMN:** Zanel pide "Introducción a BPMN" en Unidad I.

#### Qué es BPMN

- **Estándar OMG** (Object Management Group)
- **Notación gráfica** para modelar procesos de negocio
- Puente entre **analistas de negocio** (no técnicos) y **arquitectos de software** (técnicos)

#### Elementos Básicos

##### EVENTO (Circulito)

- Algo que OCURRE y dispara o completa el proceso
- **Inicio:** Proceso empieza (círculo simple)
- **Intermedio:** Algo pasa EN MEDIO (círculo doble)
- **Fin:** Proceso termina (círculo lleno)

```
o  → Inicio    ◎  → Intermedio    ●  → Fin
```

##### ACTIVIDAD/TAREA (Rectángulo)

- Trabajo que se realiza
- **Escribir informe**
- **Aprobar solicitud**

```
┌─────────────────┐
│  Escribir       │
│  informe        │
└─────────────────┘
```

##### PUERTA (Rombo)

Decisión: caminos alternativos

```
    ┌──────────────────┐
    │ ¿Aprobado?       │
    └────────┬─────────┘
        ┌────┴────┐
       Sí         No
        │          │
```

##### FLUJO (Flecha)

Conecta elementos, muestra orden

---

#### Ejemplo Completo: Proceso de Compra

```
    o                    ┌──────────────────┐
    │                    │ Seleccionar      │
 Inicio            ├─→   │ artículos        │
    │              │     └──────────────────┘
    │              │              │
    │      ┌───────┴──────────────┴────┐
    └──────→ ¿Hay stock?               │
           └──────┬──────────────┬─────┘
                 Sí             No
                  │              │
          ┌───────▼──────┐   ┌───▼──────────┐
          │ Procesar     │   │ Retrasar y   │
          │ pago         │   │ avisar       │
          └───────┬──────┘   └───┬──────────┘
                  │              │
          ┌───────┴──────────────┴────┐
          │                           │
          ├─ ¿Pago aprobado?         │
          └───┬────────────┬─────────┘
             Sí            No
              │             │
              ▼             ▼
          ┌───────────┐  ┌──────────┐
          │ Cancelar  │  │ Rechazar │
          │ pedido    │  │ pedido   │
          └───┬───────┘  └─────┬────┘
              │                │
          ┌───┴────────────────┘
          │
          ▼
          ●
         Fin
```

## 1.14 — REINGENIERÍA DE NEGOCIO, REINGENIERÍA DE SOFTWARE Y MEJORA CONTINUA

**Fuente:** Pressman, Capítulo "Mantenimiento y Reingeniería" (Capítulo 29 en la 7ª edición; Capítulo 30 en la 5ª).

### Reingeniería de Procesos de Negocio (RPN / BPR)

**Definición (revista Fortune, citada por Pressman):** "la búsqueda e implementación de **cambios radicales** en el proceso de negocios para lograr un **avance significativo**".

- Va más allá del ámbito de las tecnologías de la información y de la ingeniería de software
- Puede aplicarse a cualquier nivel de la jerarquía del negocio, pero **cuanto más alto el nivel, más crece el riesgo**; por eso la mayoría de los esfuerzos se centran en procesos o subprocesos individuales
- Es **iterativa y evolutiva**: no tiene principio ni fin, porque los objetivos del negocio cambian

**Modelo de RPN (seis actividades):**

1. **Definición del negocio:** se identifican objetivos en torno a cuatro controladores: reducción de costes, reducción de tiempos, mejora de calidad y desarrollo del personal
2. **Identificación de procesos:** se identifican los procesos críticos y se priorizan
3. **Evaluación de procesos:** se analizan y miden los procesos existentes (costes, tiempos, problemas de calidad)
4. **Especificación y diseño de procesos:** se preparan casos prácticos para cada proceso a rediseñar
5. **Creación de prototipos:** se prueba el proceso rediseñado antes de integrarlo
6. **Refinamiento e instanciación:** se refina con la realimentación del prototipo y se instancia en el sistema de negocio

**Advertencia:** la RPN no es una "bala de plata". Funciona si la aplican personas motivadas y formadas que entienden que es una **actividad continua**.

### Reingeniería del Software

Aunque una empresa rechace la reingeniería de negocio, la **reingeniería del software es algo que debe hacerse**: existen miles de sistemas heredados críticos que necesitan ser reconstruidos.

- Pressman describe el mantenimiento como un **"iceberg"**: lo visible es poco comparado con los problemas y costes que hay debajo (cita de la 5ta edición; en la 7ma, la oficial, no aparece esta metáfora)
- El mantenimiento puede representar **entre el 60% y el 70%** de las inversiones de una organización de desarrollo (dato confirmado en ambas ediciones)
- Conecta directamente con el **software heredado** y con el **deterioro** del software

**Modelo de proceso de reingeniería del software (seis actividades):**

1. **Análisis de inventario:** inventario de todas las aplicaciones para elegir candidatas
2. **Reestructuración de documentos:** mejorar la documentación escasa típica del legacy
3. **Ingeniería inversa:** recuperar la información de diseño a partir del software existente
4. **Reestructuración del código:** el tipo más común; mejora la estructura del código sin cambiar la arquitectura
5. **Reestructuración de datos:** actividad a gran escala sobre la arquitectura de datos
6. **Ingeniería directa (forward engineering):** usa la información recuperada para reconstruir o mejorar el sistema

Las actividades no siempre son secuenciales: el modelo es **cíclico**.

### Mejora Continua

- Pressman asocia la mejora continua a la **Gestión Total de la Calidad (GTC)**
- Su primer paso es **kaizen**: un sistema de mejora continua del proceso
- Es la base del **compromiso organizacional con la calidad** sobre el que se apoya la ingeniería de software (ver "Proceso, métodos y herramientas")

**Nota de edición:** "Gestión Total de la Calidad" y "kaizen" son de la 5ta edición de Pressman; no están con esos términos en el Capítulo 29 de la 7ma edición, la oficial de la cátedra.

## 2.1 — PARADIGMA: PERSPECTIVA ORIENTADA A OBJETOS VS ALGORÍTMICA

### Perspectiva Algorítmica (Tradicional)

- Bloque de construcción = procedimiento o función
- Enfoque en **CONTROL** y en descomponer algoritmos grandes en pasos pequeños
- Divide y conquista el algoritmo

**Problema:** Produce sistemas **FRÁGILES**
- Cuando requisitos cambian, se rompen fácilmente
- Porque la estructura está basada en el algoritmo, no en los conceptos del dominio

### Perspectiva Orientada a Objetos (Actual)

- Bloque de construcción = objeto o clase
- Objeto = cosa, generalmente del vocabulario del espacio del problema o solución
- Clase = descripción de objetos similares

**Ventaja:** Se convirtió en corriente principal porque funciona en:
- CUALQUIER dominio (negocio, técnico, científico)
- De CUALQUIER tamaño (pequeños programas a sistemas masivos)
- Con CUALQUIER complejidad

**Por qué:** Los conceptos del dominio (Cliente, Producto, Factura) son más estables que los algoritmos. Si el dominio cambia poco, la estructura resiste mejor.

**La mayoría de lenguajes, SO y herramientas hoy son OO de alguna forma.**

## 2.2 — OBJETO, CLASE Y MODELO DE OBJETOS

### ABSTRACCIÓN

- Quedarse con las **CARACTERÍSTICAS ESENCIALES** de algo
- Esas características **DEPENDEN DE QUIÉN MIRA**

**Ejemplo:** 
- Gato para persona común = mascota que ronronea
- Para veterinario = huesos, órganos, sistema nervioso
- Para biólogo = felino, mamífero, carnívoro

**NO hay una abstracción "correcta"**, hay una **adecuada para cada propósito**.

### OBJETO

- Entidad individual e identificable (real o abstracta)
- Con papel bien definido en el dominio del problema
- Compuesto por:

**ESTADO:** Lo que el objeto sabe (datos)
- Edad de una Persona
- Saldo de una Cuenta

**COMPORTAMIENTO:** Lo que el objeto hace (operaciones)
- Una Persona puede caminar()
- Una Cuenta puede depositar()

**IDENTIDAD:** Lo que lo distingue de otros
- Incluso si tienen el mismo estado (dos cuentas con $100 son distintas)
- Se preserva a lo largo del ciclo de vida

### CLASE

- Descripción de un **CONJUNTO DE OBJETOS** que comparten estructura y comportamiento
- El "molde" del que salen los objetos
- Cada objeto individual = una **INSTANCIA** concreta de la clase

**Relación conceptual:**
```
Instancia es a Clase como ESCENARIO es a CASO DE USO
```

---

### Notación de una Clase (Arlow-Neustadt, Cap. 4 "Clases")

Una clase se dibuja como rectángulo con hasta tres compartimentos: **nombre**, **atributos** y **operaciones**.

**Atributo:** `<visibilidad> nombre : tipo [= valorPorDefecto]` — ej. `- saldo : decimal = 0`

**Operación:** `<visibilidad> nombre(parámetro: tipo = valorPorDefecto, ...) : tipoDeRetorno` — ej. `+ depositar(monto: decimal) : boolean`

**Responsabilidades:** a veces se agrega un cuarto compartimento con las responsabilidades de la clase en texto libre (qué sabe y qué hace), separado de atributos/operaciones.

**Estereotipos:** cuando una clase tiene demasiados atributos u operaciones para mostrar todos, se agrupan bajo un estereotipo (por ejemplo `«propiedades»`) para organizar la lista.

**Cuatro técnicas comunes de modelado con clases:**
1. Modelar el **vocabulario de un sistema** (qué clases existen y qué significan)
2. Modelar la **distribución de responsabilidades** (qué sabe y hace cada clase)
3. Modelar **cosas que no son software** (por ejemplo, el "Cliente" como concepto del negocio)
4. Modelar **tipos de datos primitivos** con los estereotipos `«datatype»` (tipo simple, sin identidad, ej. Dinero) y `«enumeration»` (lista cerrada de valores con nombre, ej. EstadoPedido)

---

### LOS CUATRO ELEMENTOS MAYORES (DEBEN estar)

#### 1. ABSTRACCIÓN
Ya visto arriba.

#### 2. ENCAPSULAMIENTO
- Separar la **interfaz** (vista externa) de la **implementación** (detalles ocultos)
- Permite cambios internos sin afectar quien la usa

**Ejemplo:**
- Interfaz: `cuenta.depositar(monto)`
- Implementación: Si internamente cambias cómo se guarda el saldo (de variable simple a tabla de transacciones), la interfaz es igual

#### 3. MODULARIDAD
- Dividir en módulos **COHESIVOS** (agrupan lo relacionado)
- Y **DÉBILMENTE ACOPLADOS** (minimizan dependencias)

Si cambias un módulo, debería afectar minimalmente a los otros.

#### 4. JERARQUÍA
- Ordenación de abstracciones

**HERENCIA** (es-un: relación vertical)
- Subclases especializan superclases
- ClienteMinorista es-un Cliente

**AGREGACIÓN** (parte-de: relación horizontal)
- Un Equipo está compuesto de Jugadores
- Una Orden contiene DetalleDeOrden

---

### ELEMENTOS MENORES (Útiles pero Opcionales)

- **TIPIFICACIÓN:** Comprobar tipos de forma estricta
- **CONCURRENCIA:** Objetos activos (tienen su hilo de control)
- **PERSISTENCIA:** Existencia que trasciende tiempo o espacio (bases de datos)

## 2.3 — RELACIONES ENTRE OBJETOS

**Fuente:** Arlow y Neustadt, *Programación UML 2*, Capítulo 9 ("Relaciones").

### El Vínculo

Un **vínculo** (enlace) es una **conexión semántica entre dos objetos que permite enviar mensajes de un objeto a otro**.

- Los objetos no pueden quedarse aislados: para realizar un trabajo útil tienen que **colaborar**, y colaboran **enviándose mensajes a través de vínculos**
- Requisito mínimo: al menos uno de los objetos tiene que tener una **referencia** al otro
- Los vínculos son **conexiones dinámicas**: existen en un momento dado de la ejecución
- Normalmente un vínculo conecta exactamente dos objetos

**Rutas de acceso (cómo un objeto obtiene esa referencia al otro):**
- El objeto es un **atributo** del otro (referencia guardada de forma permanente)
- El objeto llega como **parámetro de una operación**
- El objeto se crea como **variable local** dentro de una operación
- El objeto se obtiene **llamando a otra operación** (por ejemplo, un getter)

### Vínculos y Asociaciones

**Si existe un vínculo entre dos objetos, debe existir alguna conexión semántica entre sus clases.**

- El **vínculo** es la relación entre **objetos** (instancias)
- La **asociación** es la relación entre **clases** (describe un conjunto de vínculos)

```
Vínculo es a Asociación como Objeto es a Clase
```

### Diagrama de Objetos

Muestra **objetos y sus relaciones (vínculos) en un punto en el tiempo**: es como una "instantánea" de parte de un sistema orientado a objetos en ejecución.

- Los objetos conectados pueden adoptar **roles** en cada extremo del vínculo

## 2.4 — RELACIONES ENTRE CLASES

**Crítico para diseño.** Estas son las conexiones que hacen que un conjunto de objetos forme un sistema.

### ASOCIACIÓN

- Relación estructural más general
- Indica que objetos de una clase están **conectados** con objetos de otra
- **Notación:** Línea simple con nombre (verbo) y **multiplicidad** en extremos

**Multiplicidad (notación UML real, NO es la de bases de datos):** se escribe como un intervalo mínimo..máximo en cada extremo de la línea.
- `1` — exactamente uno
- `0..1` — cero o uno
- `*` o `0..*` — cero o más
- `1..*` — uno o más
- Rangos/combinaciones exactos también son válidos: `2..5`, `0,2..4,6`

**Ojo con el error típico:** "1:1 / 1:N / N:M" es notación de modelo entidad-relación (bases de datos), **no** multiplicidad UML.

**Ejemplo:**
```
Cliente  -------realiza-------> Pedido
   1                              *
      (Un cliente realiza muchos pedidos)
```

**Navegabilidad:** una flecha en un extremo de la asociación indica que ESE extremo es navegable (el objeto del otro extremo puede "ver"/enviar mensajes hacia él); sin flecha, se asume navegable en ambos sentidos.

**Clase de asociación:** cuando la asociación misma necesita atributos u operaciones propias (no pertenecen a ninguna de las dos clases relacionadas), se modela como una clase unida a la asociación con línea punteada.

**Asociación cualificada:** usa un "calificador" (atributo) en el extremo de la asociación para reducir la multiplicidad general (por ejemplo, de 0..* a 0..1) — típicamente para modelar accesos tipo diccionario/clave.

---

### AGREGACIÓN

- Caso particular: relación "todo-parte" **DÉBIL**
- Las partes **pueden existir independientemente** del todo
- Pueden **compartirse** entre varios todos
- **Notación:** Línea terminada en **rombo HUECO** del lado del todo

**Ejemplo:**
```
    Equipo o------ Jugador
```
(Un jugador puede cambiar de equipo, existe independientemente)

---

### COMPOSICIÓN

- Agregación **FUERTE**
- Las partes **NO tienen sentido sin el todo**
- **Ciclo de vida dependiente** (si muere el todo, mueren las partes)
- **Notación:** Línea terminada en **rombo RELLENO** del lado del todo

**Ejemplo:**
```
  Factura •------ DetalleDeFactura
```
(Un detalle no tiene sentido sin factura; si borras la factura, borras los detalles)

---

### GENERALIZACIÓN (Herencia)

- Relación "es-un"
- Subclase **hereda** de superclase y puede especializarse
- **Notación:** Línea terminada en **triángulo hueco** hacia superclase

**Ejemplo:**
```
      Cliente
       /    \
      /      \
   Mayor    Minorista
```

**Vocabulario de la jerarquía (Arlow-Neustadt, Cap. 10 "Herencia y Polimorfismo"):**
- **Clase base/raíz:** la superclase que no hereda de ninguna otra
- **Clase hoja:** una subclase que no tiene subclases propias
- **Herencia simple:** una subclase tiene una sola superclase directa (lo normal en UML)
- **Herencia múltiple:** una subclase tiene más de una superclase directa
- **Clase/operación abstracta:** no se puede instanciar directamente (o no tiene implementación propia); se escribe el nombre en **cursiva**
- **Anular (override):** una subclase redefine con implementación propia una operación heredada
- **Nivel de abstracción:** todas las subclases de una misma jerarquía deberían mantenerse al mismo nivel de abstracción (no mezclar generalidad y detalle en el mismo nivel)
- **Conjuntos de generalización:** restricciones sobre las subclases de una jerarquía, combinables: `{complete}` (no hay más subclases posibles) / `{incomplete}` (puede haber más), y `{disjoint}` (un objeto es de una sola subclase) / `{overlapping}` (puede ser de varias a la vez)
- **Powertype:** una clase cuyas instancias son las subclases de otra clase (sirve para parametrizar la clasificación)

**Polimorfismo:** objetos de distintas clases responden al mismo mensaje (misma operación heredada/anulada) cada uno con su propio comportamiento. Ejemplo: `Factura.calcularTotal()` se comporta distinto en `FacturaMinorista` y en `FacturaMayorista`, pero ambas se invocan igual.

---

### DEPENDENCIA

- Relación más débil
- Cambio en una clase puede afectar otra **sin vínculo permanente**
- **Notación:** Línea **punteada** con flecha abierta
- Típicamente: una clase usa otra como **parámetro de método**

**Ejemplo:**
```
  ServicioPago .... > Banco
```
(ServicioPago usa Banco pero no lo posee)

**Tres categorías de dependencia, con estereotipos (Arlow-Neustadt, Cap. 9):**
- **De uso:** `«use»`, `«call»`, `«parameter»`, `«send»`, `«instantiate»`
- **De abstracción:** `«trace»`, `«substitute»`, `«refine»`, `«derive»`
- **De permiso:** `«access»`, `«import»`, `«permit»`

---

### CONTENCIÓN

- El elemento origen **contiene** al elemento destino (relación estructural, séptimo tipo de relación de UML junto a dependencia, asociación, agregación, composición, generalización y realización)
- **Notación:** símbolo ⊕

---

### REALIZACIÓN

- Relación semántica entre elementos
- Uno **especifica contrato**, otro se **compromete a cumplirlo**
- **Notación:** Línea **discontinua** con punta de flecha vacía

**Aparece entre:**
- Interfaz y clases que la implementan
- Caso de uso y colaboración que lo realiza

**Ejemplo:**
```
  IPersistencia <|... Usuario
```
(Usuario realiza la interfaz IPersistencia)

## 2.5 — DIAGRAMA DE CLASES

**Fuentes:** Booch, Rumbaugh y Jacobson, *El Lenguaje Unificado de Modelado*, Capítulo 8; Arlow y Neustadt, Capítulos 7 y 9.

### Qué Muestra

Un **diagrama de clases** muestra un conjunto de **clases**, **interfaces**, (y también puede incluir **paquetes/subsistemas** e **instancias**) y sus **relaciones** (asociación, agregación, composición, generalización, dependencia, realización y contención).

- Es el diagrama más común en el modelado orientado a objetos
- Representa la **vista estática** del sistema (qué tipos de objetos son importantes y cómo se relacionan)
- Cada clase se dibuja como un rectángulo con tres compartimentos: **nombre**, **atributos** y **operaciones**

### Notación Adicional de Clase (Cap. 7 de Arlow-Neustadt)

- **Visibilidad** de atributos/operaciones: `+` pública, `-` privada, `#` protegida, `~` de paquete
- **Ámbito de clase vs. de instancia:** los miembros de ámbito de clase (compartidos por todas las instancias, como un contador) se **subrayan**; el resto son de ámbito de instancia (uno por objeto)
- **Estereotipos de clase:** por ejemplo `«entity»`, `«control»`, `«boundary»` para marcar el papel de una clase
- **Constructores y destructores:** operaciones especiales que crean y destruyen instancias; se pueden mostrar como cualquier otra operación

### Notación de Interfaz

- **Interfaz proporcionada:** un pequeño círculo ("lollipop") unido a la clase que la implementa
- **Interfaz requerida:** un semicírculo ("socket") que indica que la clase necesita esa interfaz para funcionar

### Tres Usos Comunes

1. **Modelar el vocabulario** de un sistema (conecta con el modelo del dominio)
2. **Modelar colaboraciones simples** entre un pequeño grupo de clases
3. **Modelar un esquema lógico de base de datos:** el diagrama de clases de UML es un superconjunto de los diagramas entidad-relación clásicos

### Ingeniería Directa e Inversa

- **Ingeniería directa:** generar código (por ejemplo, clases Java) a partir del diagrama de clases
- **Ingeniería inversa:** generar o actualizar el diagrama de clases a partir de código ya existente
- Son procesos complementarios que permiten mantener el modelo y el código sincronizados

**Relación con el diagrama de objetos:** el diagrama de clases muestra las **clases** (lo general); el diagrama de objetos muestra **instancias concretas** en un momento dado.

## 2.6 — EL MODELO DEL DOMINIO DEL PROBLEMA

### Qué es

Captura los **CONCEPTOS IMPORTANTES** del contexto:
- Las **CLASES DE OBJETOS** del mundo real de los que el sistema se ocupa
- Sus atributos y relaciones
- Es esencialmente un **VOCABULARIO ESTRUCTURADO** del dominio

**NO describe procesos**, describe **COSAS y cómo se relacionan**.

### Valor

- Sirve de base para análisis y diseño
- Evita que programador invente nombres distintos para lo mismo
- Permite al equipo hablar el mismo idioma que el cliente

### Cómo Detectar Clases en un Enunciado

**CINCO CATEGORÍAS a buscar:**

#### 1. ROLES QUE CUMPLEN PERSONAS
- Profesor
- Alumno
- Cliente
- Vendedor
- Administrador

#### 2. ROLES DE ORGANIZACIONES
- Banco
- Empresa
- Departamento
- Filial
- Proveedor

#### 3. LUGARES
- Aula
- Biblioteca
- Sucursal
- Almacén
- Tienda

#### 4. COSAS
- Vehículo
- Libro
- Producto
- Factura
- Cuenta

#### 5. TRANSACCIONES O EVENTOS
- Venta
- Inscripción
- Vuelo
- Pedido
- Préstamo
- Transferencia

**USO:** Releer enunciado buscando explícitamente estas cinco categorías. Cubren la mayoría de clases que terminarán en modelo de dominio.

## 2.7 — PATRONES PARA LA CONSTRUCCIÓN DEL MODELO DEL DOMINIO (COAD)

### Qué es un Patrón

**Definición:** Reuso no solo de código, sino de **CONOCIMIENTO**:
- Experiencias y soluciones de análisis y diseño ya validadas
- Un patrón = ESTEREOTIPO que describe:
  - Un **PROBLEMA RECURRENTE**
  - Su **SOLUCIÓN**

Permite reconocer la **MISMA ESTRUCTURA SUBYACENTE** en dominios distintos sin redescubrirla cada vez.

### Los Patrones Transaccionales de Coad

Coad observó una **SITUACIÓN QUE SE REPITE EN CASI CUALQUIER SISTEMA DE INFORMACIÓN:**

Ocurre una **TRANSACCIÓN** entre **PARTICIPANTES**, sobre **ÍTEMS**, en un **LUGAR**, generando **LÍNEAS DE DETALLE**, y a veces dispara **OTRA TRANSACCIÓN** posterior.

### Nueve Bloques Constructivos

1. **Lugar:** Dónde ocurren las cosas (Tienda, Almacén, Sucursal)
2. **Participante:** Quién está involucrado en la transacción (Cliente, Vendedor, Proveedor)
3. **Actor:** Derivación de Participante (ClienteMinorista, ClienteMayorista)
4. **Transacción:** El evento principal (Venta, Pedido, Préstamo)
5. **TransacciónSubsiguiente:** Transacción que dispara la anterior (Venta dispara Facturación)
6. **DetalleDeTransacción:** Línea dentro de la transacción (DetalleDeVenta = cada producto vendido)
7. **DetalleDeTransacciónSubsiguiente:** Línea en la transacción subsiguiente (DetalleDeFactura)
8. **Ítem:** Lo que se transacciona (Producto, Servicio, Libro)
9. **ÍtemEspecífico:** Instancia concreta (EjemplarDeLibro, no Libro en general)

### Once Patrones de Relación Nombrados

1. **Colección-Trabajador** (Equipo contiene Personas)
2. **Actor-Participante** (ClienteMinorista es un Cliente)
3. **Participante-Transacción** (Cliente participa en Venta)
4. **Lugar-Transacción** (Tienda es dónde ocurre Venta)
5. **Transacción-DetalleDeTransacción** (Venta contiene DetalleDeVenta)
6. **Transacción-TransacciónSubsiguiente** (Venta dispara Facturación)
7. **DetalleDeTransacción-DetalleDeTransacciónSubsiguiente** (DetalleDeVenta relaciona con DetalleDeFactura)
8. **Ítem-DetalleDeTransacción** (Producto aparece en DetalleDeVenta)
9. **ÍtemEspecífico-DetalleDeTransacción** (EjemplarDeLibro aparece en DetalleDeVenta)
10. **Ítem-ÍtemEspecífico** (Libro tiene muchos Ejemplares)
11. **Asociación-OtraAsociación** (referencias de clasificación)

### Cómo Usarlos

Al leer un enunciado de dominio:
1. **Identifica relaciones** entre entidades
2. **Busca si encajan** en alguno de estos patrones
3. Eso te **ahorra tener que inventar la estructura desde cero**

**Ejemplo - Biblioteca:**
- Pedido-Recepción → Transacción-TransacciónSubsiguiente
- Libro-Ejemplar → Ítem-ÍtemEspecífico
- Lector-Préstamo → Participante-Transacción
- Préstamo-Devolución → Transacción-TransacciónSubsiguiente

## 2.8 — EL LENGUAJE UNIFICADO DE MODELADO (UML 2.0): CARACTERÍSTICAS GENERALES

**Fuentes:** Booch, Rumbaugh y Jacobson, *El Lenguaje Unificado de Modelado*, Capítulos 1 y 2; Arlow y Neustadt, Capítulo 1 ("¿Qué es UML?").

### Qué es UML

UML (Unified Modeling Language) es un **lenguaje de modelado visual** estándar para **visualizar, especificar, construir y documentar** los artefactos de un sistema con gran cantidad de software.

- Es un **lenguaje**, no una metodología: la metodología que mejor lo complementa es el **Proceso Unificado**
- Considera el mundo como **sistemas de objetos que interactúan**. Sus modelos tienen:
  - **Estructura estática:** qué tipos de objetos son importantes y cómo se relacionan
  - **Comportamiento dinámico:** cómo los objetos colaboran para realizar las funciones del sistema

### Los Tres Bloques de Construcción

1. **ELEMENTOS**
   - **Estructurales:** son los "nombres" del modelo (clase, interfaz, caso de uso, componente, nodo, **colaboración**, **clase activa**...)
   - **De comportamiento:** son los "verbos" del modelo (interacciones, máquinas de estados)
   - **De agrupación:** uno solo, el **paquete**
   - **De anotación:** uno solo, la **nota** (como un post-it)
2. **RELACIONES:** enlazan elementos (dependencia, asociación, agregación, composición, generalización, realización y contención — siete en total)
3. **DIAGRAMAS:** muestran vistas interesantes del modelo. UML define **trece tipos**: de clases, de objetos, de componentes, de estructura compuesta, de casos de uso, de secuencia, de comunicación, de estados, de actividades, de despliegue, de paquetes, de tiempos y de visión global de interacciones

### Las Reglas de UML

UML tiene reglas sintácticas y semánticas para:
- **Nombres:** cómo se llaman los elementos
- **Alcance:** el contexto que da significado a un nombre
- **Visibilidad:** cómo se pueden ver y usar los nombres desde fuera
- **Integridad:** cómo se relacionan correctamente los elementos entre sí
- **Ejecución:** qué significa ejecutar o simular un modelo dinámico

Un **modelo bien formado** es semánticamente autoconsistente y está en armonía con los demás modelos relacionados. Un modelo que NO está bien formado puede estar en alguno de estos tres estados: **abreviado** (se omite alguna parte por claridad), **incompleto** (falta algún elemento todavía) o **inconsistente** (se contradice a sí mismo, el único estado realmente problemático).

### Los Cuatro Mecanismos Comunes

1. **Especificaciones:** descripciones textuales de las características y la semántica de los elementos; lo más importante del modelo
2. **Adornos:** información sobre un elemento que se muestra en el diagrama para ilustrar un punto
3. **Divisiones comunes:**
   - **Clase y objeto** (cuenta bancaria / mi cuenta bancaria) — la misma dicotomía se repite en otros clasificadores: caso de uso/ejecución, componente/instancia, nodo/instancia (de ahí que en general se hable de **clasificador e instancia**)
   - **Interfaz e implementación** (el contrato / los detalles de cómo funciona)
   - **Tipo y rol:** un tipo describe qué ES algo (su clasificación); un rol describe qué HACE o cómo se comporta en un contexto particular (por ejemplo, una Persona puede jugar el rol de Cliente en una relación)
4. **Mecanismos de extensibilidad:**
   - **Restricciones:** agregan nuevas reglas a los elementos
   - **Estereotipos:** introducen nuevos elementos de modelado basados en los existentes
   - **Valores etiquetados:** agregan nuevas propiedades (palabra clave + valor)
   - Un **perfil UML** es una colección de restricciones, estereotipos y valores etiquetados

### La Arquitectura: Vista 4+1

- **Vista lógica:** funcionalidad y vocabulario del sistema
- **Vista de interacción** (a veces llamada "de procesos"): rendimiento, escalabilidad, capacidad de procesamiento
- **Vista de implementación:** ensamblaje y gestión de la configuración
- **Vista de despliegue:** topología, distribución, entrega e instalación
- **Vista de casos de uso:** une a las cuatro anteriores y describe los requisitos
