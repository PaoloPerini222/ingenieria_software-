## 3.1 — QUÉ ES UN PROCESO DE DESARROLLO

### La Pregunta Fundamental

La pregunta que responde un proceso de desarrollo es, en el fondo, muy simple:

**¿Cómo hago para que un equipo de personas construya un sistema sin que cada uno tire para su lado?**

### Qué Define

Un proceso define:

- **QUIÉN** hace QUÉ (roles y responsabilidades)
- **En QUÉ ORDEN** (secuencia de actividades)
- **Con QUÉ ENTRADAS** (qué necesita para empezar)
- **Produciendo QUÉ RESULTADOS** (artefactos entregables)

### Características del Proceso Unificado

Jacobson, Booch y Rumbaugh lo describen como una **PLANTILLA**: no dice qué sistema construir, dice **cómo organizar el trabajo** de construirlo.

**EL PROCESO UNIFICADO NO ES UNA RECETA RÍGIDA** sino un **MARCO GENÉRICO que se ESPECIALIZA**.

Un proyecto de 3 personas para un sistema chico y un proyecto de 200 personas para un sistema crítico usan el **MISMO MARCO**, pero lo **INSTANCIAN DE MANERA MUY DISTINTA:**

- Distinta cantidad de iteraciones
- Distinto nivel de formalidad en los artefactos
- Distinta cantidad de roles
- Distinto rigor en documentación

**Los autores insisten** en este punto porque **EL ERROR MÁS COMÚN** al aplicar el proceso es **tomarlo como un CHECKLIST OBLIGATORIO** y ahogar el proyecto en documentación que nadie usa.

### Relación Proceso-Herramientas

**Punto importante:** La relación entre proceso y herramientas **es mutua**.

- Las herramientas influyen en el proceso
- El proceso dirige a las herramientas

**Problemas típicos:**
- Un proceso que exige artefactos que ninguna herramienta puede mantener sincronizados → termina abandonado
- Una herramienta poderosa sin un proceso que la ordene → montañas de diagramas inconsistentes

**El equilibrio entre ambos es una CONDICIÓN PARA QUE EL PROCESO SOBREVIVA AL PRIMER MES DE PROYECTO.**

## 3.2 — MODELOS DE PROCESO DE SOFTWARE: CONCEPTO (PRESSMAN)

Pressman define proceso como:

"Un **conjunto de actividades, acciones y tareas** que se ejecutan cuando va a crearse un producto de trabajo"

Distingue TRES NIVELES DE GRANULARIDAD:

### Nivel 1: ACTIVIDAD

- Persigue un objetivo amplio
- Ejemplo: "comunicación con los interesados"
- Se aplica sin importar el dominio o el tamaño del proyecto
- Es el nivel más alto

### Nivel 2: ACCIÓN

- Un conjunto de tareas que produce un **producto de trabajo importante**
- Ejemplo: "diseñar la arquitectura"
- Más específica que actividad, menos que tarea

### Nivel 3: TAREA

- Se centra en un objetivo **pequeño y bien definido**
- Ejemplo: "ejecutar una prueba unitaria"
- Produce un resultado tangible
- El nivel más granular

### Flujos de Proceso

Antes de elegir un modelo de proceso concreto, Pressman distingue cómo se organizan temporalmente las actividades (comunicación, planeación, modelado, construcción, despliegue):

- **Flujo LINEAL:** ejecuta las cinco actividades en secuencia, una sola vez
- **Flujo ITERATIVO:** repite las actividades, con realimentación, antes de avanzar
- **Flujo EVOLUTIVO:** ejecuta las actividades de forma **circular/concéntrica**, cada vuelta produce una versión más completa
- **Flujo PARALELO:** ejecuta algunas actividades en paralelo con otras (por ejemplo, modelar una parte mientras se construye otra)

### Patrones de Proceso (Ambler)

Un **patrón de proceso** describe una solución probada a un problema asociado a un contexto específico del proceso de ingeniería de software. Formato típico: nombre, fuerzas, tipo, contexto inicial, problema, solución, contexto resultante, patrones relacionados, usos y ejemplos conocidos.

**Tres tipos:**
- **Patrón de etapa:** define un problema asociado con una actividad del marco de trabajo (por ejemplo, "RequerimientosPocoClaros")
- **Patrón de tarea:** aborda un problema asociado a una acción o tarea de ingeniería de software
- **Patrón de fase:** define la secuencia de actividades que ocurren dentro de un proceso, aunque el flujo de trabajo interno de cada actividad pueda variar

### El Proceso NO es una Receta Rígida

**Punto que suele aparecer en examen:** El proceso NO es una receta rígida que se sigue dogmáticamente, sino un enfoque **ADAPTABLE** al:
- Problema específico
- Proyecto en cuestión
- Equipo disponible
- Cultura organizacional

Por eso un proceso adoptado para un proyecto puede diferir bastante del adoptado para otro, en:
- El flujo de actividades y sus dependencias
- El grado de definición de cada tarea
- El involucramiento del cliente
- La autonomía del equipo
- El rigor con que se documenta todo

## 3.3 — ACTIVIDADES GENÉRICAS DEL PROCESO

Pressman propone una estructura de proceso general, válida para **cualquier proyecto sin importar su tamaño**, compuesta por **CINCO ACTIVIDADES:**

### 1. COMUNICACIÓN

- Antes de cualquier trabajo técnico, es **crítico comunicarse** y colaborar con el cliente y los demás interesados
- **Objetivo:** Entender sus objetivos y reunir los requerimientos
- Sin comunicación clara = requisitos equivocados desde el inicio

### 2. PLANEACIÓN

- Crea un **mapa** —el plan del proyecto
- Describe:
  - Las tareas técnicas
  - Los riesgos
  - Los recursos
  - Los productos de trabajo
  - Una programación de actividades
- **Objetivo:** Saber antes de empezar qué va a costar y cuánto durará

### 3. MODELADO

- Consiste en **crear un bosquejo** de lo que se va a construir
- **Objetivo:** Entender mejor los requerimientos y el diseño que los satisfará
- Acá es donde se aplica todo el modelado orientado a objetos
- Responde "¿qué vas a construir?" antes de construirlo

### 4. CONSTRUCCIÓN

- Combina:
  - La **generación de código**
  - Las **pruebas** necesarias para descubrir errores
- Es donde se materializa lo planeado y modelado

### 5. DESPLIEGUE

- El software, **completo o como incremento parcial**, se entrega al cliente
- El cliente lo **evalúa** y da una **retroalimentación**
- Esta retroalimentación alimenta el trabajo siguiente (iterativamente)

### Aplicación Iterativa

Para muchos proyectos, estas cinco actividades se aplican de forma **ITERATIVA**, repitiéndose en sucesivas vueltas que producen cada vez un **incremento del software**.

La misma idea que después se formaliza mucho más en el Proceso Unificado.

### Actividades Sombrilla

Se complementan con **actividades sombrilla** que corren a lo largo de **TODO el proyecto** y no en un momento puntual:

- Seguimiento y control del proyecto
- Gestión del riesgo
- Aseguramiento de la calidad
- Revisiones técnicas
- Medición
- Gestión de la configuración
- Gestión de la reutilización
- Preparación del producto de trabajo

## 3.4 — MODELOS DE PROCESO: PARADIGMAS GENERALES

La mayoría de los modelos de proceso concretos se apoyan, en el fondo, en **UNO DE TRES PARADIGMAS:**

**Vocabulario de Pressman:** cascada, iterativo y CBSE (más los modelos de la 3.5) se agrupan como modelos de proceso **PRESCRIPTIVOS**; se los llama así porque prescriben un conjunto de actividades, acciones, tareas, hitos y productos de trabajo que se requieren para hacer ingeniería de software de calidad. Se oponen a los modelos **ESPECIALIZADOS** (CBSE, métodos formales y desarrollo orientado a aspectos), pensados para circunstancias particulares.

### Paradigma 1: ENFOQUE EN CASCADA

Considera las actividades (especificación, diseño, implementación, pruebas) como **FASES SEPARADAS Y SECUENCIALES**, donde cada etapa se cierra antes de pasar a la siguiente.

```
Especificación → Diseño → Implementación → Pruebas → Entrega
```

**Ventajas:**
- Más simple de entender
- Estructura clara
- Hitos definidos

**Desventajas:**
- Rígido frente al cambio de requisitos
- Problemas no se descubren hasta tarde (cuando la solución es costosa)
- Cliente no ve nada hasta el final

**Variante — Modelo en V:** vincula cada acción de la mitad izquierda de la "V" (comunicación, modelado, construcción) con una acción de verificación/validación en la mitad derecha, a medida que el equipo "baja" por la izquierda y "sube" por la derecha ejecutando pruebas que validan cada modelo producido. Mismas desventajas que la cascada clásica.

---

### Paradigma 2: DESARROLLO ITERATIVO

Entrelaza especificación, desarrollo y validación.

- Un sistema inicial se construye **rápido** a partir de especificaciones abstractas
- Se va refinando en **sucesivas vueltas** según la retroalimentación del cliente
- Cada vuelta produce un incremento ejecutable

```
Iter 1: Especif → Diseño → Impl → Prueba → Demo
Iter 2: Refina Especif → Diseño → Impl → Prueba → Demo
Iter 3: ...
```

**Ventajas:**
- Flexible al cambio
- Feedback constante
- Problemas se descubren temprano (antes es más barato arreglar)
- Cliente ve progreso frecuente

**Desventajas:**
- Más complejo de gestionar
- Requiere disciplina

---

### Paradigma 3: INGENIERÍA DE SOFTWARE BASADA EN COMPONENTES (CBSE)

Supone que ya existen **partes reutilizables** del sistema, y enfoca el desarrollo en **integrar esas partes** más que en construirlas desde cero.

```
Especificación → Búsqueda de Componentes → Integración → Pruebas → Entrega
```

**Ventajas:**
- Entrega más rápida
- Menos riesgo de defectos (componentes ya probados)
- Costo más bajo

**Desventajas:**
- Depende de disponibilidad de componentes adecuados
- Menos control sobre cada pieza

---

### La Importancia del Proceso Unificado

**EL PROCESO UNIFICADO es, en el fondo, una ESPECIALIZACIÓN MUY ELABORADA del segundo de estos paradigmas: el DESARROLLO ITERATIVO.**

Toma el concepto de iteración y lo formaliza en:
- Fases (Inicio, Elaboración, Construcción, Transición)
- Workflows (Requisitos, Análisis, Diseño, Implementación, Prueba)
- Artefactos específicos
- Roles y responsabilidades

## 3.5 — OTROS MODELOS DE PROCESO: VENTAJAS Y DESVENTAJAS

### Modelo de Construcción de Prototipos

- El desarrollador y el cliente **definen juntos** los objetivos generales
- Se hace un **diseño rápido** que lleva a un prototipo
- El cliente lo **evalúa**
- Se refina en un ciclo que se repite hasta llegar a un resultado final

**Ventaja:** Aprende rápido qué quiere el cliente

**Desventaja:** Puede terminar en código de baja calidad si el prototipo se convierte en producto

---

### Modelo DRA (Desarrollo Rápido de Aplicaciones)

- Una adaptación de **alta velocidad** del modelo en cascada
- Combina:
  - Modelado de gestión
  - Modelado de datos
  - Modelado de proceso
- Con **generación de aplicaciones** a partir de componentes reutilizables

**Objetivo:** Acelerar la entrega

**Nota de edición:** el DRA y las Técnicas de Cuarta Generación (más abajo) no aparecen en el Capítulo 2 de la 7ª edición de Pressman (la oficial de la cátedra); son contenido de ediciones anteriores. Conviene confirmar con la cátedra si los sigue tomando.

---

### Modelo en Espiral

- El proceso recorre, en sentido horario, las mismas **cinco actividades genéricas** vistas en 3.3 (Comunicación, Planeación, Modelado, Construcción, Despliegue), repitiéndolas en sucesivas vueltas
- Cada vuelta incluye un **análisis de riesgo** antes de seguir avanzando
- Termina, eventualmente, en el mantenimiento

**Característica:** Combina la naturaleza iterativa de la construcción de prototipos con el control y la sistematicidad del modelo en cascada

---

### Modelo de Desarrollo Concurrente

- Define una serie de **eventos** que disparan **transiciones de estado** para cada actividad de ingeniería de software
- De forma que **distintas personas puedan trabajar simultáneamente** sobre distintas partes del sistema
- En vez de esperar turnos secuenciales

**Ventaja:** Paralelización de trabajo

---

### Modelo de Métodos Formales

- Especifica, desarrolla y verifica un sistema aplicando una **notación matemática rigurosa**
- Permite detectar errores que otras técnicas no pueden encontrar

**Desventajas:**
- Muy caro
- Requiere antecedentes matemáticos poco comunes
- Solo se usa en sistemas críticos (sistemas de vuelo, medicina)

---

### Desarrollo de Software Orientado a Aspectos (DSOA)

- Proporciona un proceso y un conjunto de métodos para definir, especificar, diseñar y construir **aspectos**: propiedades que afectan a varios puntos del sistema (por ejemplo, seguridad, manejo de excepciones, desempeño) y que de otra forma quedarían dispersas por muchos componentes
- Es, junto con CBSE y Métodos Formales, el tercer modelo de proceso **especializado**

---

### Técnicas de Cuarta Generación (T4G)

- Apuntan a especificar software a un **nivel cercano al lenguaje natural** o a **notaciones gráficas**
- De ahí salieron los lenguajes de programación de cuarta generación (4GL)
- Simplifican instrucciones que en lenguajes anteriores hubieran sido mucho más complicadas

**Ejemplo:** SQL es 4GL, permite expresar consultas sin especificar cómo obtenerlas

---

### Proceso Personal del Software (PPS) y Proceso del Equipo de Software (PES)

Propuestos por **Watts Humphrey**, aplican la disciplina de proceso a escala individual y de equipo pequeño:

- **PPS (Personal Software Process):** cada desarrollador gestiona su propio proceso con actividades propias: **planeación, diseño de alto nivel (con revisión del diseño), desarrollo, y post mórtem**
- **PES (Team Software Process):** organiza un equipo pequeño autodirigido con sus propias actividades: **inicio del proyecto, diseño de alto nivel, implementación, integración y pruebas, y post mórtem**
- **Objetivo de ambos:** hacer que cada ingeniero (y cada equipo) mida y mejore su propio desempeño, de forma análoga a como el CMM lo hace a nivel organizacional

## 3.6 — LAS CUATRO "P": PERSONAS, PROYECTO, PRODUCTO Y PROCESO

**Fuente:** Jacobson, Booch y Rumbaugh, *El Proceso Unificado de Desarrollo de Software*, Capítulo 2.

El resultado final de un **proyecto** software es un **producto** que toma forma gracias a la intervención de muchas **personas**. Un **proceso** guía sus esfuerzos, a modo de plantilla, normalmente automatizado por **herramientas**.

### Las Cuatro "P" (y las Herramientas)

- **PERSONAS:** los principales autores de un proyecto (arquitectos, desarrolladores, ingenieros de prueba, personal de gestión, usuarios, clientes y otros interesados). Son seres humanos reales (más abajo se explica la diferencia con *trabajador*, que es un papel/rol, no una persona).
- **PROYECTO:** elemento organizativo a través del cual se gestiona el desarrollo de software. El resultado de un proyecto es **una versión de un producto**.
- **PRODUCTO:** artefactos que se crean durante la vida del proyecto: **modelos, código fuente, ejecutables y documentación**.
- **PROCESO:** definición del conjunto completo de actividades necesarias para **transformar los requisitos de usuario en un producto**. Es una **plantilla para crear proyectos**.
- **HERRAMIENTAS:** software que se usa para automatizar las actividades definidas en el proceso.

### Las Personas son Decisivas

- Los procesos de desarrollo **afectan a las personas**: el proceso debe hacerles el trabajo más eficaz
- **De "recursos" a "trabajadores":** un *trabajador* es un **puesto (papel)** que una persona puede desempeñar. Una persona puede ser varios trabajadores durante un proyecto, y un trabajador puede ser un grupo de personas

### Los Proyectos Construyen el Producto

- El primer ciclo de vida de un proyecto desarrolla el sistema inicial (proyecto "inicial" o *green-field*)
- Todo proyecto obtiene su producto a través de una **secuencia de cambios** (ciclos, fases, iteraciones)

### El Producto es Más que Código

- Un sistema software es **todos los artefactos** necesarios para representarlo de forma comprensible para máquinas y personas
- Un sistema posee una **colección de modelos** (casos de uso, análisis, diseño, implementación, despliegue, prueba)

### El Proceso Dirige los Proyectos

- El proceso es una **plantilla** que se **especializa** para cada proyecto (tamaño, dominio, organización)
- Las **herramientas son esenciales**: influyen en el proceso y el proceso las dirige (equilibrio entre ambos)

## 3.7 — EL PROCESO UNIFICADO: CONCEPTO Y CARACTERÍSTICAS

**Fuente:** Jacobson, Booch y Rumbaugh, *El Proceso Unificado de Desarrollo de Software*, Capítulo 1.

### Qué es el Proceso Unificado

Un **proceso de desarrollo de software** es el conjunto de actividades necesarias para **transformar los requisitos de un usuario en un sistema software**.

El Proceso Unificado es más que un simple proceso: es un **marco de trabajo genérico** que puede especializarse para una gran variedad de sistemas, áreas de aplicación, organizaciones, niveles de aptitud y tamaños de proyecto.

- Está **basado en componentes**: el sistema está formado por componentes interconectados a través de interfaces bien definidas
- Utiliza **UML** para preparar todos los esquemas del sistema

### Las Tres Frases Clave

Los aspectos que definen al Proceso Unificado y lo hacen único se resumen en tres frases:

1. **Dirigido por casos de uso**
2. **Centrado en la arquitectura**
3. **Iterativo e incremental**

Las tres ideas se sostienen mutuamente: los casos de uso dirigen y la arquitectura da forma; ambos evolucionan en paralelo a lo largo de las iteraciones.

## 3.8 — PRIMERA CARACTERÍSTICA: DIRIGIDO POR CASOS DE USO

Un caso de uso describe una **porción de funcionalidad** que le da un **valor observable** a un **ACTOR** (usuario o sistema externo).

### LA AFIRMACIÓN FUERTE

Los casos de uso **NO son solamente una técnica para capturar requisitos**: son el **HILO CONDUCTOR de TODO el proyecto**.

### CÓMO FUNCIONA LA CADENA

```
1. Modelo de casos de uso
         ↓
2. Modelos de análisis (cada caso de uso se realiza mediante
   una colaboración de clases de análisis)
         ↓
3. Modelos de diseño (cada caso de uso se realiza mediante
   una colaboración de clases de diseño y subsistemas)
         ↓
4. Implementación (componentes que realizan esas clases)
         ↓
5. Pruebas (casos de prueba derivados de casos de uso)
```

### TRAZABILIDAD

Cuando un requisito cambia, se puede rastrear:
- **QUÉ CASOS DE USO** afecta
- Desde ahí, **QUÉ CLASES** tienen que cambiar
- **QUÉ COMPONENTES** hay que reescribir
- **QUÉ PRUEBAS** hay que actualizar

Esa cadena se llama **TRAZABILIDAD** y es **UNA DE LAS RAZONES MÁS FUERTES** para adoptar el enfoque.

---

### LOS CASOS DE USO CUMPLEN TRES FUNCIONES

1. **Capturar los requisitos** que aportan valor añadido
   - Evita que el equipo construya funcionalidad que nadie pidió

2. **Dirigir el proceso**
   - La trazabilidad que acabamos de describir

3. **Idear la arquitectura**
   - Nos lleva directamente a la segunda característica: centrado en la arquitectura

## 3.9 — SEGUNDA CARACTERÍSTICA: CENTRADO EN LA ARQUITECTURA

La **arquitectura** es la **DECISIÓN ESTRATÉGICA de alto nivel** sobre la estructura del sistema.

Es como el "plano" del edificio software.

### PUNTO CLAVE

La mayoría de los casos de uso **IMPACTAN ARQUITECTURA**.

Una arquitectura sólida:
- Facilita la trazabilidad
- Permite dividir el trabajo entre equipos
- Reduce los riesgos de integración
- Facilita el mantenimiento futuro

---

### FRASE ORO (Resume el Rol del Arquitecto)

"El objetivo de la arquitectura de un sistema es encontrar el conjunto **MÍNIMO de colaboraciones BIEN ESTRUCTURADAS** que satisfacen el **flujo de eventos especificado en TODOS los casos de uso** del sistema"

**Leyendo esa frase:**
- "Conjunto mínimo" → la arquitectura no debe tener piezas de más
- "Bien estructuradas" → calidad interna de cada colaboración
- "Que satisfacen el flujo de eventos de todos los casos de uso" → **LA FUNCIÓN MANDA:** una arquitectura elegante que no soporta los casos de uso no sirve

---

### RESPUESTA A "¿POR QUÉ LOS CASOS DE USO GUÍAN Y LA ARQUITECTURA CONDUCE?"

**Esta frase es la mejor respuesta posible para un examen oral:**

**Los casos de uso especifican QUÉ debe hacer el sistema (el requisito funcional sin comprometerse con HOW se implementa).** La arquitectura es el conjunto mínimo de colaboraciones bien estructuradas que satisfacen ese QUÉ. Así, el orden es: primero entender QUÉ (casos de uso), luego decidir CÓMO estructura general (arquitectura), luego CÓMO detalles (diseño), luego materializar (código).

## 3.10 — TERCERA CARACTERÍSTICA: ITERATIVO E INCREMENTAL

**Fuente:** Jacobson, Booch y Rumbaugh, Capítulos 1 y 5.

### La Idea

El desarrollo de un producto software comercial puede durar meses o más de un año. Es práctico **dividir el trabajo en partes más pequeñas o miniproyectos**.

- Cada miniproyecto es una **iteración** que resulta en un **incremento**
- **Iteración:** pasos en el flujo de trabajo
- **Incremento:** crecimiento en el producto

### Cómo se Eligen las Iteraciones

Los desarrolladores basan la selección de qué implementar en cada iteración en dos factores:

1. La iteración trata un **grupo de casos de uso** que juntos amplían la utilidad del producto
2. La iteración trata los **riesgos más importantes**

Cada iteración recorre los **flujos de trabajo** (requisitos, análisis, diseño, implementación y prueba).

### Por Qué un Desarrollo Iterativo e Incremental

- Atenuación de **riesgos** (se atacan temprano)
- Obtención de una **arquitectura robusta**
- Gestión de **requisitos cambiantes**
- Permitir **cambios tácticos**
- Conseguir una **integración continua**
- Conseguir un **aprendizaje temprano**

La aproximación iterativa está **dirigida por los riesgos**.

### Conexión con las Otras Dos Características

- Los **casos de uso** dicen qué construir en cada iteración
- La **arquitectura** da la estructura que las iteraciones van completando

## 3.11 — LAS CUATRO FASES DEL PROCESO UNIFICADO

**Fuente:** Jacobson, Booch y Rumbaugh, Capítulos 1 (1.5.2 "Fases dentro de un ciclo") y 6 (6.4).

La vida del Proceso Unificado se organiza en **ciclos**; cada ciclo termina con una **versión del producto** y se divide en **cuatro fases**. Cada fase termina con un **hito**, determinado por la disponibilidad de un conjunto de artefactos.

### Fase 1: INICIO

Se desarrolla una **descripción del producto final** a partir de una buena idea y se presenta el **análisis de negocio**.

**Responde tres preguntas:**
- ¿Cuáles son las principales funciones del sistema para sus usuarios más importantes?
- ¿Cómo podría ser la arquitectura del sistema?
- ¿Cuál es el plan de proyecto y cuánto costará desarrollar el producto?

**Actividades:**
- Se construye un **modelo de casos de uso simplificado** con los casos de uso más críticos
- La arquitectura es **provisional** (un esbozo de los subsistemas más importantes)
- Se identifican y priorizan los **riesgos** más importantes
- Se planifica en detalle la fase de elaboración y se estima el proyecto de manera aproximada
- Los analistas identifican la mayoría de los casos de uso para delimitar el sistema y **detallan los más importantes (menos del 10%)**

### Fase 2: ELABORACIÓN

Se **especifican en detalle la mayoría de los casos de uso** y se **diseña la arquitectura** del sistema.

- Se capturan la mayoría de los requisitos restantes: el objetivo es haber capturado **sobre un 80% de los requisitos** al final de la fase
- Solo **entre un 5 y un 10%** de esos requisitos queda implementado en la línea base
- Se realizan los casos de uso más críticos identificados en el inicio
- **Resultado:** la **línea base de la arquitectura** (un "esqueleto" ejecutable, con poco músculo)
- **Al final** el director de proyecto puede planificar las actividades y estimar los recursos para terminar el proyecto

**Pregunta clave:** ¿son suficientemente estables los casos de uso, la arquitectura y el plan, y están los riesgos suficientemente controlados como para comprometerse al desarrollo entero mediante un contrato?

### Fase 3: CONSTRUCCIÓN

Se **crea el producto**: se añaden los "músculos" (software terminado) al esqueleto (la arquitectura).

- La línea base de la arquitectura crece hasta convertirse en el sistema completo
- **El grueso de los recursos** se emplea en esta fase
- La arquitectura es estable, aunque pueden descubrirse mejoras menores
- Al final, el producto contiene todos los casos de uso acordados para esta versión (aunque puede no estar libre de defectos)

**Pregunta decisiva:** ¿cubre el producto las necesidades de algunos usuarios de manera suficiente como para hacer una primera entrega?

### Fase 4: TRANSICIÓN

Cubre el período durante el cual el producto se convierte en **versión beta**.

- Un número reducido de usuarios con experiencia prueba el producto e informa defectos y deficiencias
- Se corrigen los problemas y se incorporan mejoras para la versión general
- Incluye **fabricación, formación del cliente (capacitación), línea de ayuda y asistencia**, y corrección de defectos tras la entrega
- También incluye la **migración y conversión de datos**: ayudar a convertir las bases de datos del sistema antiguo a la nueva configuración, a veces con cambio de formato
- Los defectos se dividen en los que justifican una versión incrementada (*delta*) y los que se corrigen en la siguiente versión normal

### Hitos

- Cada fase termina con un **hito principal**: los directores toman **decisiones cruciales** (continuar, reorientar, cancelar) antes de pasar a la siguiente fase
- Los hitos permiten controlar el progreso según **criterios predefinidos**
- Cada **iteración** también termina con un hito menor

**Los cuatro hitos principales, con su nombre oficial:**
1. **Fin de Inicio →** "Objetivos del ciclo de vida"
2. **Fin de Elaboración →** "Arquitectura del ciclo de vida"
3. **Fin de Construcción →** "Capacidad operativa inicial"
4. **Fin de Transición →** "Versión del producto"

**Línea base:** una versión (interna o externa) del conjunto de artefactos revisados y aprobados generados por una iteración.

**Incremento:** la diferencia entre una línea base y la siguiente.

### Captura de Requisitos a lo Largo de las Fases

- **Inicio:** se identifica la mayoría de los casos de uso y se detallan los más importantes
- **Elaboración:** se captura la mayoría de los requisitos restantes (hasta ~80%)
- **Construcción:** se capturan (e implementan) los requisitos restantes
- **Transición:** casi no hay captura de requisitos, salvo que cambien

## 3.12 — PLANIFICACIÓN: DOS PLANES, NO UNO

### Plan de Proyecto (Mapa Global)

- Asigna tiempos a cada fase
- Fija fechas y criterios de hitos principales
- Establece cuántas iteraciones tendrá cada fase
- Necesariamente **GRUESO** al principio (poco se sabe)
- Se va **precisando** a medida que se aprende

---

### Plan de Iteración (Detallado)

- Se arma cuando la fecha de comienzo se acerca
- **Contenido decidido por:**
  1. Qué casos de uso completar (parcial o totalmente)
  2. Qué riesgos técnicos mitigar
  3. Qué cambios de requisitos o defectos absorber
  4. Qué subsistemas implementar (total o parcial)

---

### Regla Práctica

- **Plan de iteración actual** = COMPLETAMENTE detallado
- **Plan de siguiente** = A MEDIO detallar
- **Planes posteriores** = Apenas ESBOZADOS

**Razón:** Planificar en detalle 8 meses adelante es desperdiciar trabajo (habremos aprendido cosas que invalidan ese detalle)

## 3.13 — FASES VS FLUJOS DE TRABAJO: LOS CINCO FLUJOS FUNDAMENTALES

Esta es **la confusión más común** de toda la unidad, y por eso mismo la **pregunta más rentable de contestar bien**.

### Concepto Fundamental

**Las fases y los flujos de trabajo son DOS DIMENSIONES INDEPENDIENTES del proceso.**

- **FASES** = **TIEMPO:** Dividen el calendario del proyecto
- **FLUJOS DE TRABAJO** = **TIPO DE TRABAJO:** Dividen las clases de actividad

**En CADA FASE se hace algo de TODOS los flujos de trabajo, en PROPORCIONES DISTINTAS.**

```
                      Flujos de Trabajo
                 Req  Análisis  Diseño  Impl  Prueba
            ┌────┬────┬────┬────┬────┐
Inicio      │ XX │ X  │    │    │    │
            ├────┼────┼────┼────┼────┤
Elaboración │XXX │XXX │ XX │ XX │ X  │
            ├────┼────┼────┼────┼────┤
Construcción│ X  │ XX │XXX │XXX │ XX │
            ├────┼────┼────┼────┼────┤
Transición  │    │    │ X  │ XX │XXX │
            └────┴────┴────┴────┴────┘
```

### Los Cinco Flujos de Trabajo Fundamentales

Se REPITEN EN CADA ITERACIÓN, EN TODAS LAS FASES. **Lo que cambia es la PROPORCIÓN de esfuerzo.**

El gráfico de las "jorobas superpuestas" lo muestra:
- Eje horizontal = tiempo (fases e iteraciones)
- Cada curva = esfuerzo en cada flujo

**Observaciones:**

2. ANÁLISIS Y DISEÑO: Pico en elaboración
3. IMPLEMENTACIÓN: Pico en construcción
4. PRUEBA: **Crece sostenidamente**, máximo en final de construcción y transición, **PERO EMPIEZA DESDE ITERACIÓN 1**

### Conclusión Crítica

**En el Proceso Unificado NO existe "la etapa de pruebas".**

Se prueba desde la primera iteración. **Lo que existe es una FASE donde el esfuerzo de prueba es MÁXIMO.**

**Esa distinción entre "etapa" y "proporción de esfuerzo" es exactamente lo que separa iterativo de cascada disfrazada.**

## 3.14 — DESARROLLO ÁGIL: EL MANIFIESTO (2001)

Un grupo de desarrolladores condensó lo que había aprendido sobre construir software de forma más efectiva.

### Aclaración Importante

**El manifiesto NO rechaza lo que aparece a la derecha de cada frase.** Dice explícitamente que también se VALORAN, **solo que MENOS** que los de la izquierda a la hora de **ELEGIR**.

### Los Cuatro Valores

#### 1. INDIVIDUOS E INTERACCIONES sobre procesos y herramientas

- Reconoce que el software se construye con personas, no con automatización
- Excelentes procesos sin buena gente = fracaso
- Buena gente con proceso mediocre = más chance de éxito

#### 2. SOFTWARE FUNCIONANDO sobre documentación extensiva

- Lo que importa al final es que el sistema funciona
- La documentación es valiosa solo si ayuda a que funcione
- Documentación exhaustiva que nadie lee = desperdicio

#### 3. COLABORACIÓN CON EL CLIENTE sobre negociación contractual

- Significa trabajar **juntos** durante todo el proyecto
- No "contratamos esto, ustedes lo entregan"
- Cliente como parte del equipo

#### 4. RESPUESTA ANTE EL CAMBIO sobre seguir un plan

- Los requisitos cambian, especialmente en contextos volátiles
- Tener un plan detallado de 6 meses es fantasía si el mercado es dinámico
- Mejor: plan flexible, revisar frecuentemente

---

### Los Doce Principios

#### BLOQUE 1 — ENTREGA TEMPRANA Y CAMBIO

1. **Prioridad más alta:** Satisfacer cliente mediante entrega temprana y continua de software con valor

2. **Cambios aceptados** incluso en etapas tardías (dan ventaja competitiva)

3. **Software funcionando entregado entre 2 semanas y 2 meses** (preferir período más corto)

#### BLOQUE 2 — PERSONAS

4. **Responsables de negocio y desarrolladores** trabajan JUNTOS COTIDIANAMENTE

5. **Proyectos basados en INDIVIDUOS MOTIVADOS**
   - Dar entorno
   - Apoyo
   - Confianza

6. **Conversación CARA A CARA** es la forma más eficiente de comunicar

#### BLOQUE 3 — MEDICIÓN Y RITMO

7. **Software funcionando = MEDIDA PRINCIPAL DE PROGRESO** (no horas de trabajo, no completitud de documentación)

8. **Desarrollo SOSTENIBLE:** Ritmo que todos puedan mantener indefinidamente (no crunch permanente)

9. **Atención continua a excelencia técnica y buen diseño MEJORA AGILIDAD**

#### BLOQUE 4 — ORGANIZACIÓN

10. **SIMPLICIDAD:** Maximizar cantidad de trabajo que NO se hace (YAGNI: You Aren't Gonna Need It)

11. **Mejores arquitecturas, requisitos, diseños EMERGEN** de equipos AUTO-ORGANIZADOS

12. **A intervalos regulares**, el equipo REFLEXIONA cómo ser más efectivo y AJUSTA comportamiento

## 3.15 — SCRUM: MARCO ÁGIL

**Fuente:** *La Guía de Scrum 2020* (edición en español), bibliografía de la cátedra.

### Definición

Marco de trabajo liviano que ayuda a personas, equipos y organizaciones a generar **VALOR** a través de soluciones **ADAPTATIVAS** para problemas **COMPLEJOS**.

Intencionalmente incompleto: define solo las partes necesarias para implementar teoría, se apoya en inteligencia colectiva de quien lo usa.

### Se Apoya en

- **EMPIRISMO:** Conocimiento viene de experiencia y decidir basado en lo observado
- **PENSAMIENTO LEAN:** Reducir desperdicio, enfocarse en lo esencial

### Los Tres Pilares

#### 1. TRANSPARENCIA
- Proceso y trabajo visibles para quien lo hace y quien lo recibe
- Todos saben qué está pasando

#### 2. INSPECCIÓN
- Revisar frecuentemente trabajo y progreso
- Detectar desvíos rápido
- Inspección sin acción = inútil

#### 3. ADAPTACIÓN
- Ajustar proceso o producto apenas se detecta desvío
- Si algo no funciona, cambiar

### Los Cinco Valores (según la Guía 2020: Compromiso, Enfoque, Apertura, Respeto y Coraje)

- **Compromiso:** Con el objetivo
- **Enfoque:** En lo importante
- **Apertura:** Sin secretos
- **Respeto:** Mutuo
- **Coraje:** Para decir verdades incómodas

---

### El Scrum Team

Equipo pequeño (típicamente ≤10 personas)

**MULTIFUNCIONAL:** Entre todos tienen habilidades necesarias para generar valor

**AUTO-GESTIONADO:** Decide internamente quién hace qué, cuándo, cómo

**No hay subequipos ni jerarquías**

**Una unidad enfocada en UN objetivo:** El Objetivo del Producto

#### TRES CONJUNTOS DE RESPONSABILIDADES

**DEVELOPERS:**
- Se comprometen a crear el Increment cada Sprint
- Arman Sprint Backlog
- Cuidan calidad (Definición de Hecho (Definition of Done))
- Ajustan plan día a día
- Se responsabilizan mutuamente

**PRODUCT OWNER:**
- Maximiza valor del producto resultante
- Define y comunica Objetivo del Producto
- Crea y ordena elementos del Product Backlog
- Responsable de que trabajo se haga (aunque pueda delegarlo)

**SCRUM MASTER:**
- Responsable de que Scrum se entienda y practique correctamente
- Ayuda equipo a auto-gestionarse
- Procura eliminar impedimentos
- Asegura que eventos se lleven a cabo
- NO es jefe del equipo (es facilitador)

---

### El Sprint y los Cuatro Eventos

**SPRINT** = Contenedor de duración fija (≤1 mes) dentro del cual ocurre TODO el trabajo necesario para avanzar hacia Objetivo del Producto

#### RESTRICCIONES DURANTE SPRINT

- No se permiten cambios que pongan en riesgo objetivo
- Calidad NO baja
- Alcance se puede aclarar y renegociar conforme se aprende

---

#### EVENTO 1: SPRINT PLANNING (Inicia el Sprint)

**Responde tres preguntas:**

1. **¿POR QUÉ es valioso este Sprint?** (Objetivo del Sprint)
2. **¿QUÉ se puede hacer?** (Elementos del Backlog seleccionados)
3. **¿CÓMO se realizará el trabajo?** (Plan del trabajo)

---

#### EVENTO 2: DAILY SCRUM (15 minutos, solo Developers, cada día)

- Inspeccionar avance hacia Objetivo del Sprint
- Ajustar plan del día siguiente
- NO es reporte de status, es planificación

---

#### EVENTO 3: SPRINT REVIEW (Cierra el trabajo)

- Mostrar resultado a interesados
- Decidir qué hacer a continuación
- NO es presentación, es sesión de trabajo
- Cliente da retroalimentación

---

#### EVENTO 4: SPRINT RETROSPECTIVE (Equipo reflexiona)

- ¿CÓMO TRABAJÓ el equipo? (personas, interacciones, procesos, herramientas)
- ¿QUÉ cambiar para próximo Sprint?
- Es el momento para mejorar el proceso mismo

---

### Los Artefactos de Scrum y sus Compromisos

Cada artefacto tiene un **COMPROMISO** que le da sentido:

#### PRODUCT BACKLOG

- Lista ordenada y emergente de TODO lo que se necesita mejorar el producto
- **COMPROMISO:** Objetivo del Producto (estado futuro que equipo persigue a largo plazo)

#### SPRINT BACKLOG

- Plan del Sprint actual:
  - Objetivo del Sprint
  - Elementos elegidos
  - Plan de entregarlos
- **COMPROMISO:** Objetivo del Sprint

#### INCREMENT

- Cada peldaño concreto y utilizable que se suma a los anteriores
- **COMPROMISO:** Definición de Hecho (Definition of Done) (criterio de calidad que decide cuándo un elemento está terminado)

#### Conexión con Proceso Unificado

Como iteración del PU termina en release ejecutable vs criterios predefinidos, un Sprint termina en Increment vs Definición de Hecho (Definition of Done).

**La lógica es la misma:** ciclos cortos, cierre ejecutable, medida de avance real.

## 3.16 — DESARROLLO LEAN

Aplica principios del "pensamiento esbelto" de Toyota al software (adaptado por Mary y Tom Poppendieck).

### Los Siete Principios

#### 1. ELIMINAR DESPERDICIO
- Todo lo que no agrega valor (funcionalidad no usada, documentación innecesaria, esperas)
- Trabajo parcialmente hecho
- Cambios de contexto innecesarios

#### 2. AMPLIFICAR APRENDIZAJE
- Ciclos cortos de retroalimentación
- Aprender rápido del mercado

#### 3. DECIDIR LO MÁS TARDE
- Mayor información disponible
- Menos probabilidad de equivocarse

#### 4. ENTREGAR LO MÁS RÁPIDO
- Feedback constante
- Market feedback inmediato

#### 5. POTENCIAR AL EQUIPO
- Autonomía y responsabilidad
- Confianza en el equipo

#### 6. CONSTRUIR INTEGRIDAD
- Conceptual (que el sistema tenga sentido) y percibida por cliente (que se vea bien)
- Coherencia en el diseño

#### 7. VER EL TODO
- Optimizar sistema completo
- No cada parte aislada

---

### Diferencia con Scrum

- **Scrum** enfatiza **ESTRUCTURA** (roles, eventos, artefactos)
- **Lean** enfatiza **FLUJO CONTINUO** (sin iteraciones de duración fija) y **ELIMINACIÓN DE DESPERDICIO**

**Realidad actual:** Muchos usan HÍBRIDO (Scrum para estructura, Lean para filosofía)

## 3.17 — KANBAN

**Fuente:** *Essential Kanban Condensed* (edición en español), bibliografía de la cátedra.

### De Dónde Viene

- La palabra japonesa **"kanban"** significa **"señal"**, "tarjeta de señalización", "cartel" o "tablero visual"
- El Método Kanban se ocupa del **diseño, la gestión y la mejora de sistemas de flujo** para el trabajo del conocimiento
- Se basa en **hacer visible** el trabajo intangible
- Introducir y respetar límites de trabajo en progreso cambia de un sistema **"push" (empujar)** a un sistema **"pull" (tirar)**: los elementos nuevos no se inician hasta que se completa el trabajo anterior

### Valores

Los valores de Kanban se resumen en una palabra: **respeto**. El libro los desgrana en **nueve valores**: Transparencia, Equilibrio, Colaboración, Foco en el cliente, Flujo, Liderazgo, Entendimiento, Acuerdo y Respeto (este último, como base del resto).

### Los Tres Principios Directores

1. **Sostenibilidad:** encontrar un ritmo sostenible y un foco en la mejora (mira hacia adentro)
2. **Orientación al servicio:** rendimiento y satisfacción del cliente (mira hacia afuera)
3. **Supervivencia:** mantener la competitividad y la adaptabilidad (mira hacia el futuro)

### Los Seis Principios Fundacionales

**Principios de gestión del cambio:**
1. Empezar con lo que estés haciendo ahora (entender los procesos actuales y respetar roles y responsabilidades)
2. Acordar buscar la mejora a través del **cambio evolutivo**
3. Fomentar el **liderazgo en cada nivel** de la organización

**Principios de despliegue de servicios:**
4. Entender las necesidades y expectativas de los clientes y focalizarse en ellas
5. Gestionar el trabajo: dejar que la gente se **auto-organice** alrededor de las tareas
6. Evolucionar las políticas para mejorar los resultados hacia el cliente y el negocio

### Las Seis Prácticas Generales

#### 1. VISUALIZAR
Todo el trabajo debe estar **visible** en un tablero:
```
      TO DO       |     DOING      |     DONE
    ┌─────────┐  |   ┌─────────┐  |  ┌─────────┐
    │ Feature │  |   │ Feature │  |  │ Feature │
    │    1    │  |   │    5    │  |  │    3    │
    └─────────┘  |   └─────────┘  |  └─────────┘
```
- Cada columna = etapa del proceso; cada tarjeta = elemento de trabajo; el orden es de izquierda a derecha

#### 2. LIMITAR EL TRABAJO EN PROGRESO (WiP)
- Máximo de elementos en curso simultáneamente
- Observar, limitar y optimizar el WiP mejora el tiempo de entrega, la calidad y la tasa de entrega
- La gestión inefectiva busca que todos estén "ocupados"; Kanban busca que el trabajo **fluya**

#### 3. GESTIONAR EL FLUJO
- Maximizar la entrega de valor, minimizar los **tiempos de entrega (Lead Time)** y que el flujo sea predecible
- El **Lead Time** (tiempo de entrega al cliente) es una métrica clave

#### 4. HACER EXPLÍCITAS LAS POLÍTICAS
- Reglas claras sobre cómo se trabaja (los límites de WiP y la definición de Hecho son ejemplos de políticas)

#### 5. IMPLEMENTAR CIRCUITOS DE RETROALIMENTACIÓN
- Reuniones y revisiones cíclicas (**cadencias**); Kanban define siete: revisión de la estrategia, revisión de las operaciones, revisión de los riesgos, revisión de la prestación de servicio, reunión de retroalimentación, la reunión Kanban (diaria) y reunión de planificación de la entrega

#### 6. MEJORAR COLABORATIVAMENTE, EVOLUCIONAR EXPERIMENTALMENTE
- La mejora se hace en equipo y con experimentos, usando modelos y el método científico

### Diferencia Kanban vs Scrum

| Aspecto | Kanban | Scrum |
|---------|--------|-------|
| **Ciclo** | Flujo continuo, sin iteraciones fijas | Sprints de duración fija (un mes o menos) |
| **Cambios** | En cualquier momento, respetando el WiP | No se permiten cambios que pongan en riesgo el Objetivo del Sprint |
| **Roles** | Empieza respetando los roles actuales | Tres responsabilidades (Product Owner, Scrum Master, Developers) |
| **Métricas** | Lead Time, tasa de entrega | Avance hacia el Objetivo del Sprint y del Producto |

**Conclusión:** Kanban es un método evolutivo que parte de lo que ya se hace; Scrum es un marco con estructura definida (responsabilidades, eventos y artefactos).

## 3.18 — TIPOS DE PROCESO: TRADICIONAL VS ÁGIL

| Aspecto | Tradicional | Ágil |
|---------|------------|------|
| **REQUISITOS** | Fijarlos y congelarlos temprano (especificación detallada) | Asume cambio, organiza proceso para absorberlo incluso late |
| **DOCUMENTACIÓN** | Extensa, vehículo principal de comunicación | Conversación cara a cara, documentación solo lo esencial |
| **PLANIFICACIÓN** | Detallada, largo plazo, definida al inicio | Adaptativa, se replanifica en cada iteración |
| **ENTREGA** | Una sola al final (o pocos hitos grandes) | Frecuente e incremental |
| **ROL DEL CLIENTE** | Involucrado inicio y final | Continuo |
| **CUÁNDO USAR** | Requisitos estables, fuertes restricciones contractuales | Alta incertidumbre (típico: desarrollo web) |

## 3.19 — INTRODUCCIÓN A LA EVALUACIÓN Y MEJORA DEL PROCESO

**Fuentes:** Pressman, Capítulo 2 ("El proceso": madurez del proceso); planificación de la cátedra ("Introducción a enfoques de evaluación y mejora del proceso").

### Por Qué Evaluar el Proceso

La existencia de un proceso no garantiza que el software se entregue a tiempo ni que satisfaga las necesidades. La **evaluación del proceso** busca asegurar que cumple un conjunto de criterios básicos para una ingeniería de software exitosa, y detectar dónde mejorarlo.

### El Modelo de Capacidad de Madurez (CMM / MCM) del SEI

El **Software Engineering Institute (SEI)** definió un modelo que mide la efectividad global de las prácticas de ingeniería de software de una organización mediante **cinco niveles de madurez del proceso**:

1. **Nivel 1 — Inicial:** el proceso es caso por caso, a veces caótico. Pocos procesos definidos; el éxito depende del esfuerzo individual.
2. **Nivel 2 — Repetible:** procesos de gestión de proyectos para seguir coste, planificación y funcionalidad. Se repiten éxitos de proyectos similares.
3. **Nivel 3 — Definido:** el proceso de gestión e ingeniería se documenta, estandariza e integra en un proceso de toda la organización.
4. **Nivel 4 — Gestionado:** se recopilan medidas detalladas del proceso y de la calidad del producto; se controlan **cuantitativamente**.
5. **Nivel 5 — Optimización:** la retroalimentación cuantitativa y las ideas innovadoras permiten la **mejora continua** del proceso.

**Cada nivel incluye todas las características del anterior** (para estar en nivel 3 hay que haber alcanzado el nivel 2).

Cada nivel se asocia con **áreas clave del proceso (ACP)** que deben lograrse (por ejemplo, en nivel 2: gestión de configuración del software).

### Otros Enfoques de Evaluación

Pressman (7ª ed.) menciona también otros enfoques de evaluación: **SCAMPI** (del SEI), **CBA IPI**, **SPICE** (ISO/IEC 15504) e **ISO 9001:2000** para software.

### Conexión

Conecta con la definición IEEE (**cuantificable**: sin medición no hay mejora) y con la **mejora continua** de la Unidad I.

## 4.1 — TRABAJADORES, ACTIVIDADES Y ARTEFACTOS

**Fuente:** Jacobson, Booch y Rumbaugh, *El Proceso Unificado de Desarrollo de Software*.

Vocabulario de tres piezas:

### TRABAJADOR

- Un **ROL**, no una persona
- Define comportamiento y responsabilidades
- Ejemplos: analista, arquitecto, ingeniero de casos de uso, ingeniero de componentes

**Punto clave:** Una persona puede desempeñar varios roles; un rol puede ser desempeñado por varias personas

**Ventaja:** Permite describir el proceso sin hablar del organigrama de una empresa concreta

Cuando el libro dice "el arquitecto es responsable de X", no está diciendo que hace falta contratar a alguien con ese cargo. Está diciendo que **ALGUIEN tiene que asumir ese conjunto de responsabilidades**.

---

### ACTIVIDAD

Una **unidad de trabajo** que un trabajador (en su rol) realiza

**Ejemplo:** "Revisar modelo de análisis" es una actividad que hace el arquitecto

---

### ARTEFACTO

Un **PRODUCTO del proceso**:
- Modelo
- Documento
- Componente
- Caso de prueba

## 4.2 — EL FLUJO DE TRABAJO DE REQUISITOS: CONCEPTO E IMPORTANCIA

**Fuente:** Jacobson, Booch y Rumbaugh, *El Proceso Unificado de Desarrollo de Software*, Capítulo 6 ("Captura de requisitos: de la visión a los requisitos").

### Concepto

El **flujo de trabajo de requisitos** es el trabajo de **capturar los requisitos**: descubrir y describir lo que el sistema debe hacer, guiando el desarrollo hacia el **sistema correcto**.

### Importancia

- La captura de requisitos es **complicada**: los usuarios no suelen saber con precisión qué necesitan, y los requisitos parten de puntos muy distintos (desde una vaga noción hasta una especificación detallada)
- Su **objeto** es describir los requisitos del sistema con suficiente claridad como para que **clientes, usuarios y desarrolladores lleguen a un acuerdo** sobre qué debe hacer el sistema
- Los requisitos se describen en el **lenguaje del cliente**

### Los Pasos del Flujo de Trabajo

Aparte de las diferencias en los puntos de partida, en la mayoría de los casos se siguen estos pasos (no necesariamente por separado):

1. **Enumerar los requisitos candidatos**
2. **Comprender el contexto del sistema**
3. **Capturar requisitos funcionales**
4. **Capturar requisitos no funcionales**

### El Papel de los Requisitos en el Ciclo de Vida

- El trabajo de requisitos se hace **fundamentalmente durante el inicio y la elaboración**
- **Inicio:** se identifica la mayoría de los casos de uso y se detallan los más importantes (menos del 10%)
- **Elaboración:** se captura la mayoría de los requisitos restantes (sobre un 80%)
- **Construcción:** se capturan los restantes
- **Transición:** casi no hay captura de requisitos

## 4.3 — ARTEFACTOS DEL FLUJO DE REQUISITOS

**Fuente:** Jacobson, Booch y Rumbaugh, Capítulos 6 y 7.

### Artefactos del Capítulo 6 (Contexto y Candidatos)

#### LISTA DE CARACTERÍSTICAS
- Reúne las **buenas ideas** de clientes, usuarios, analistas y desarrolladores, antes de que se conviertan en requisitos
- Se usa **solo para la planificación** del trabajo
- Cada característica tiene un **nombre corto**, una **breve explicación** y **valores de planificación**:
  - **Estado:** propuesto, aprobado, incluido o validado
  - **Coste estimado** de implementación (tipos de recursos y horas-persona)
  - **Prioridad:** crítico, importante o secundario
  - **Nivel de riesgo:** crítico, significativo u ordinario

#### MODELO DEL DOMINIO
- Captura los tipos más importantes de **objetos en el contexto del sistema** ("cosas" que existen o eventos que suceden)
- Ayuda a construir un **glosario** de términos

#### MODELO DEL NEGOCIO
- Describe los **procesos de negocio** (existentes o percibidos) para comprenderlos
- Es un **supraconjunto** del modelo del dominio (incluye más que solo los objetos del dominio)

#### REQUISITOS ADICIONALES
- Requisitos **no funcionales genéricos** que no pueden relacionarse con un caso de uso concreto ni con una clase concreta del mundo real (por ejemplo, plataforma, legales, rendimiento global)
- Los no funcionales **específicos de un caso de uso** se describen en ese caso de uso (requisitos especiales)

**Cinco categorías de requisitos adicionales:**
1. **Requisito de interfaz:** cómo debe interactuar el sistema con otros sistemas externos
2. **Requisito físico:** restricciones físicas sobre el hardware que alojará el software
3. **Restricción de diseño:** limita las opciones de diseño (por ejemplo, un SO o lenguaje obligatorio)
4. **Restricción de implementación:** limita las opciones de implementación (por ejemplo, estándares de codificación)
5. **Otros requisitos:** seguridad, disponibilidad, facilidad de aprendizaje, legales/normativos

### Artefactos del Capítulo 7 (Captura como Casos de Uso)

1. **Modelo de casos de uso:** contiene actores, casos de uso y sus relaciones; representa los requisitos funcionales
2. **Actor:** cada tipo de usuario o sistema externo que interactúa con el sistema
3. **Caso de uso:** cada forma en que los actores usan el sistema
4. **Descripción de la arquitectura (vista del modelo de casos de uso):** muestra los casos de uso **arquitectónicamente significativos**
5. **Glosario:** define los términos comunes; evita que una misma palabra signifique cosas distintas
6. **Prototipo de interfaz de usuario:** ayuda a comprender y especificar las interacciones entre actores y sistema

## 4.4 — TRABAJADORES DEL FLUJO DE REQUISITOS

**Fuente:** Jacobson, Booch y Rumbaugh, Capítulo 7 (7.3 "Trabajadores").

Los trabajadores **no son personas**: son **puestos (roles)** con responsabilidades. Una persona puede desempeñar varios, y varios pueden ser desempeñados por un grupo.

### Los Cuatro Trabajadores del Flujo de Requisitos

1. **ANALISTA DEL SISTEMA**
   - Responsable del **conjunto completo de requisitos** modelados como casos de uso
   - Delimita el sistema: **encuentra los actores y los casos de uso**
   - Asegura que el modelo de casos de uso sea completo y consistente
   - Es responsable del **glosario**
   - Estructura el modelo de casos de uso
2. **ESPECIFICADOR DE CASOS DE USO**
   - **Detalla** uno o más casos de uso (el analista no puede detallar todos solo)
   - Trabaja estrechamente con los usuarios reales de sus casos de uso
3. **DISEÑADOR DE INTERFACES DE USUARIO**
   - Da **forma visual** a las interfaces de usuario
   - Construye los **prototipos de interfaz** para algunos casos de uso
4. **ARQUITECTO**
   - Describe la **vista de la arquitectura del modelo de casos de uso**
   - **Prioriza** los casos de uso (identifica los arquitectónicamente significativos)

**Punto clave para examen:** no confundir al **especificador de casos de uso** (de esta lista, detalla los casos de uso en el flujo de REQUISITOS) con el **"ingeniero de casos de uso"** (realiza los casos de uso construyendo clases de análisis y diseño) ni con el **"ingeniero de componentes"** (implementa y prueba los componentes de código): estos dos últimos son trabajadores de los flujos de **análisis y diseño**, no del flujo de requisitos.

## 4.5 — ACTIVIDADES DEL FLUJO DE REQUISITOS

**Fuente:** Jacobson, Booch y Rumbaugh, Capítulo 7 (7.4 "Flujo de trabajo").

### Las Cinco Actividades y Quién las Realiza

| Actividad | Trabajador responsable |
|-----------|------------------------|
| **Encontrar actores y casos de uso** | Analista de sistemas |
| **Priorizar casos de uso** | Arquitecto |
| **Detallar un caso de uso** | Especificador de casos de uso |
| **Prototipar la interfaz de usuario** | Diseñador de interfaces de usuario |
| **Estructurar el modelo de casos de uso** | Analista de sistemas |

### Cómo Fluyen

1. El **analista de sistemas** ejecuta *Encontrar actores y casos de uso* para una primera versión del modelo, usando como entrada la **lista de características** y el **modelo del dominio o del negocio**
2. El **arquitecto** identifica los casos de uso **arquitectónicamente relevantes** para la priorización
3. Los **especificadores** describen en detalle los casos de uso priorizados
4. En paralelo, los **diseñadores de interfaz** sugieren interfaces adecuadas para cada actor
5. El **analista** reestructura el modelo (por ejemplo, definiendo generalizaciones) en *Estructurar el modelo de casos de uso*

Las actividades **no son una secuencia estricta**: pueden retomarse muchas veces y cada una puede producir solo una fracción de su resultado.

### Actividad: Encontrar Actores y Casos de Uso

- Encontrar los actores
- Encontrar los casos de uso
- Describir brevemente cada caso de uso
- Describir el modelo de casos de uso completo (incluye preparar un glosario)

**Dos criterios para elegir actores candidatos:**
1. Debe poder identificarse al menos **un usuario real** que represente al actor candidato
2. Debe existir **coincidencia mínima** entre los roles de distintos actores (si se solapan, hay que combinarlos o generalizarlos — por ejemplo, Comprador y Vendedor como especializaciones de Cliente del Banco)

**Dos criterios para identificar casos de uso (delimitan su "ámbito"):**
1. **Resultado de valor:** cada ejecución satisfactoria debe dar un resultado observable que aporte valor a un actor
2. **Un actor en concreto:** evita definir casos de uso demasiado grandes o genéricos

### Actividad: Detallar un Caso de Uso

**Pasos para detallar:**

1. Elegir un **camino básico completo** (el "normal", el que el usuario percibe como más habitual y aporta el valor más obvio)
2. Describirlo en una sección propia
3. Describir los **caminos alternativos** como desviaciones del básico

**Elementos mínimos de la descripción:**

- **Precondición:** estado inicial
- Cómo y cuándo comienza
- Orden de las acciones (numeradas)
- La **interacción del sistema con los actores** y qué cambios produce
- La **utilización de objetos, valores y recursos del sistema**
- Cómo y cuándo termina
- **Postcondición:** posibles estados finales
- Caminos no permitidos
- Caminos alternativos
- **Requisitos especiales:** no funcionales propios de ese caso de uso

#### EJEMPLO: Caso de Uso "Pagar Factura"

```
Precondición: Comprador ha recibido bienes y al menos una factura

Flujo Básico:
  1. Comprador invoca operación para hojear facturas
  2. Sistema verifica consistencia con confirmaciones de pedido
  3. Comprador planifica factura para pagar por banco
  4. Sistema genera petición de pago
  5. Si hay dinero suficiente, realiza pago
     (usando caso de uso abstracto "Realizar Transacción")
  6. Notifica a comprador y vendedor

Caminos Alternativos:
  - En paso 3: Comprador puede rechazar factura
  - En paso 5: Si no hay dinero, cancela pago

Postcondición: Factura pagada o pago cancelado

Requisitos Especiales:
  - El pago debe procesarse en menos de 1 segundo en el 90% de los casos
```

### Actividad: Prototipar la Interfaz de Usuario

Se diseña primero la interfaz **lógica** y después la **física**. El diseño lógico responde cinco preguntas:
1. Qué elementos de interfaz de usuario se necesitan
2. Cómo se relacionan entre sí
3. Cómo se usan en los casos de uso
4. Cuál es su apariencia
5. Cómo se manipulan

A esto se suman preguntas adicionales para determinar qué elementos debe poder usar cada actor (accesibilidad por actor).

**Modelado esencial de casos de uso (Larry Constantine):** hay que evitar que la propia descripción del caso de uso contenga decisiones implícitas de interfaz. Por ejemplo, decir "hojear facturas" ya sugiere una lista en pantalla, y eso limita innecesariamente al diseñador de interfaces antes de que diseñe.

Se construyen **prototipos** para validar con los usuarios. Los revisores chequean: que el actor pueda **navegar adecuadamente**, que la apariencia sea **agradable y consistente**, y que se **cumplan los estándares** de la organización.

### Actividad: Estructurar el Modelo de Casos de Uso

- Se extraen descripciones de funcionalidad **generales y compartidas**: eso es **generalización** (una tarea distinta de la inclusión)
- Se extraen fragmentos de comportamiento que se repiten en varios casos de uso y se encapsulan aparte: eso es **inclusión** — relación inversa a la extensión
- Se extraen descripciones **opcionales o adicionales**: eso es **extensión**

**Vocabulario resultante:**
- **Caso de uso concreto:** instanciable directamente, completo en sí mismo
- **Caso de uso abstracto:** no se instancia solo, existe para ser incluido, extendido o generalizado por otros
- **Caso de uso "real":** el que efectivamente percibe el actor, resultado de combinar generalización y extensión sobre los casos de uso abstractos

## 4.6 — EL MODELO DE REQUERIMIENTOS

**Fuente:** Jacobson, Booch y Rumbaugh, Capítulo 6 (Figura 6.1).

### El Conjunto de Requisitos

Para capturar requisitos de manera eficaz, los analistas necesitan un conjunto de artefactos al que Jacobson llama **conjunto de requisitos**. Reemplaza a la especificación de requisitos tradicional.

| Trabajo a realizar | Artefactos resultantes |
|--------------------|------------------------|
| Enumerar requisitos candidatos | **Lista de características** |
| Comprender el contexto del sistema | **Modelo del dominio o del negocio** |
| Capturar los requisitos funcionales | **Modelo de casos de uso** |
| Capturar los requisitos no funcionales | **Requisitos adicionales** o casos de uso concretos (requisitos especiales) |

- El **modelo de casos de uso** y los **requisitos adicionales** juntos definen una **especificación de requisitos tradicional**
- Se completan con el **glosario** y los **prototipos de interfaz de usuario** (Capítulo 7)

### Por Qué es un Modelo "Vivo"

Los requisitos **cambian constantemente**: cada iteración refleja algún cambio en el conjunto de requisitos. El número de cambios disminuye a medida que avanza la construcción y los requisitos se estabilizan.

**Base sobre la que se apoyan después el análisis y el diseño.**
