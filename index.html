## 5.1 — EL CONCEPTO DE REQUERIMIENTO

### Definición

Condición o capacidad que un **SISTEMA debe cumplir** para:
- Satisfacer un contrato
- Satisfacer un estándar
- Satisfacer una especificación
- Permitir que un usuario resuelva un problema u objetivo

**Unidad básica sobre la que se construye TODO desarrollo posterior:** diseño, implementación, pruebas se rastrean hasta algún requisito que los justifique (**TRAZABILIDAD**).

---

### Clasificación Principal

#### REQUISITOS FUNCIONALES
- **QUÉ** debe hacer el sistema
- Funciones o servicios concretos que ofrece
- Ejemplo: "el sistema debe permitir registrar venta de artículo"
- **En PU** se capturan mediante **CASOS DE USO**

#### REQUISITOS NO FUNCIONALES
- **CÓMO debe comportarse el sistema**
- Los **ATRIBUTOS DE CALIDAD** (mantenibilidad, confiabilidad, eficiencia, usabilidad) + rendimiento, seguridad, portabilidad, disponibilidad
- Ejemplo: "sistema debe responder a consulta en <2 segundos"

---

### Subclasificación de NO FUNCIONALES

#### Requisitos del PRODUCTO
- Rendimiento
- Usabilidad
- Fiabilidad
- Portabilidad

#### Requisitos ORGANIZACIONALES
- Impuestos por políticas de cliente o desarrollador
- Ejemplo: "usar solo software open source"

#### Requisitos EXTERNOS
- Requisitos legales
- Interoperabilidad con otros sistemas
- Ejemplo: "cumplir con GDPR"

---

### Por Nivel de Abstracción

#### USUARIO
- Lenguaje natural
- Dirigidos a clientes sin conocimientos técnicos
- "El sistema debe permitir a un cliente verificar el estado de su pedido"

#### SISTEMA
- Más detallados y precisos
- Dirigidos a público técnico
- Base del contrato
- "El system debe exponer API REST en port 8080 que retorna JSON con campos..."

## 5.2 — PROPÓSITO DE LA INGENIERÍA DE REQUERIMIENTOS

### Objetivo Último

Reducir al **MÍNIMO el riesgo de CONSTRUIR EL SISTEMA EQUIVOCADO**.

### EVIDENCIA

La mayoría de proyectos que fracasan lo hacen **NO por errores de programación** sino por **COMPRENSIÓN DEFICIENTE** de lo que había que construir.

## 5.3 — LOS CINCO PROCESOS DE INGENIERÍA DE REQUERIMIENTOS

### 1. ELICITACIÓN (Sacar)

- Descubre (mediante contacto con interesados y otras fuentes) servicios que sistema debe proveer
- Y restricciones bajo las que opera
- **Técnicas:** Entrevistas, observación, talleres, cuestionarios

---

### 2. ANÁLISIS (Examinar)

- Examina requisitos obtenidos para detectar:
  - Ambigüedades
  - Incompletitudes
  - Conflictos
- Negocia hasta conjunto consistente
- **Punto:** No basta recopilar, hay que validar que tenga sentido

---

### 3. ESPECIFICACIÓN (Escribir)

- Redacta requisitos analizados en documento formal
- A nivel de detalle apropiado para diseño e implementación
- **Resultado:** Documento ERS (Especificación de Requerimientos del Software)

---

### 4. VALIDACIÓN (Verificar)

- Verifica que especificación efectivamente define **el sistema que cliente quiere**
- No confundir con "verificación": validación es "¿estamos construyendo lo correcto?"
- Verificación es "¿estamos construyéndolo correctamente?"

---

### 5. ADMINISTRACIÓN (Gestionar)

- Gestiona cambios en requisitos a lo largo del proyecto
- Manteniendo trazabilidad
- **Crítico:** Los requisitos NO son congelados, evolucionan

## 5.4 — LA ELICITACIÓN: TÉCNICAS

### 1. ENTREVISTAS

- Con usuarios e interesados (stakeholders)
- Descubre necesidades explícitas y tácitas
- **Ventaja:** Profundo
- **Desventaja:** Lento, sesgo

---

### 2. CUESTIONARIOS/ENCUESTAS

- Relevar muchos usuarios
- **Ventaja:** Rápido, escala
- **Desventaja:** Superficial, baja tasa de respuesta

---

### 3. OBSERVACIÓN/ETNOGRAFÍA

- Ver usuarios trabajar en contexto real
- Detecta necesidades tácitas (que el usuario no expresa pero vive)
- **Ventaja:** Descubre lo no dicho
- **Desventaja:** Muy lento

---

### 4. TALLERES DE REQUISITOS

- Sesiones grupales facilitadas con múltiples interesados
- Negocia y resuelve conflictos en vivo
- **Ventaja:** Construye consenso rápido
- **Desventaja:** Requiere facilitador experto

---

### 5. PROTOTIPADO

- Versión preliminar para que usuarios reaccionen
- **Ventaja:** Tangible, genera feedback
- **Desventaja:** Puede consumir recursos innecesarios

---

### 6. ANÁLISIS DE DOCUMENTACIÓN

- Manuales de sistemas anteriores
- Formularios
- Sistemas heredados
- **Ventaja:** Información ya existe
- **Desventaja:** Puede estar desactualizada

## 5.5 — ESPECIFICACIÓN Y EL DOCUMENTO ERS

### ESPECIFICAR

Redactar de forma **CLARA, PRECISA, VERIFICABLE** en documento que sirva de referencia común.

---

### CÓMO SE ESPECIFICAN LOS REQUISITOS

#### REQUISITOS FUNCIONALES
- **En PU:** Mediante **MODELO DE CASOS DE USO**
- Cada caso de uso con flujo detallado es especificación de un fragmento concreto de funcionalidad desde perspectiva de valor para usuario

---

#### REQUISITOS NO FUNCIONALES
- Más difícil, porque suelen ser vagos ("rápido")
- Necesitan traducirse a **criterios medibles**
- Ejemplo: "rápido" → "<2 segundos con 500 usuarios concurrentes"

---

### DOCUMENTO ERS (Especificación de Requerimientos del Software)

- **Artefacto formal** que reúne TODOS los requisitos acordados
- **Standard IEEE 830** o directamente **MODELO DE CASOS DE USO** (en PU)

---

### Un Buen ERS Debe Ser

#### COMPLETO
- Cubre todos requisitos relevantes
- Nada importante falta

#### CONSISTENTE
- Sin contradicciones
- Un requisito no contradice otro

#### NO AMBIGUO
- Una única interpretación por requisito
- Evita palabras vagas

#### VERIFICABLE
- Forma objetiva de comprobar cumplimiento
- "Fácil" es no verificable; "<2 segundos" sí

#### TRAZABLE
- Vincula a origen (quién pidió, por qué)
- Vincula a artefactos que lo implementan (qué clases, qué componentes, qué pruebas)

#### MODIFICABLE
- Estructura que permite cambios sin perder coherencia
- Cambiar un requisito no requiere reescribir todo

## 5.6 — VALIDACIÓN

### Concepto

Verificar que especificación refleja **lo que cliente necesita** ANTES de diseño/implementación.

### PUNTO CRÍTICO

Costo de corregir error **CRECE CON EL TIEMPO:**
- Requisito mal entendido en elicitación = minutos de corrección
- Mismo error en pruebas del sistema = rediseño/reimplementación (horas/días)
- Mismo error después de entrega = catastrófico (clientes enojados, datos a migrar)

---

### TÉCNICAS

#### 1. REVISIONES
- Formales e informales
- Con múltiples interesados
- Leyendo la especificación juntos

---

#### 2. CASOS DE PRUEBA A PARTIR DE REQUISITOS
- Si es difícil imaginar prueba razonable para un requisito, el requisito está mal especificado
- Un requisito que no se puede probar no se puede verificar

---

#### 3. PROTOTIPOS DE INTERFAZ
- **La herramienta más potente**
- Detecta malentendidos ANTES de construir interfaz real
- Usuario viendo pantalla entiende rápido qué se espera

---

### ANÁLISIS DE CONSISTENCIA ENTRE MODELOS

- **Modelo de Casos de Uso vs Glosario:** ¿Términos consistentes?
- **Glosario vs Modelo de Dominio:** ¿Objetos mencionados existen con atributos que descripciones suponen?
- **Prototipos vs Flujos de casos de uso:** ¿Interfaz refleja fielmente los pasos?

## 5.7 — ADMINISTRACIÓN

Gestionar cambios en requisitos a lo largo del proyecto.

### PUNTO CRÍTICO

Los requisitos **NO se congelan** después de captura.

Se refinan, mejoran, a veces cambian completamente a medida que el proyecto avanza y se aprende.

La administración consiste en:
- Registrar cambios solicitados
- Evaluar impacto (cuánto cuesta implementar)
- Decidir si entra en próxima iteración o se aplaza
- Mantener trazabilidad de qué versión implementa qué requisito

## 5.8 — REQUISITOS EN ENFOQUES ÁGILES: USER STORIES Y ESTIMACIÓN

### USER STORY (Historia de Usuario)

Forma mucho más **LIVIANA** que caso de uso completo, pensada para caber en tarjeta y servir de **DISPARADOR DE CONVERSACIÓN** (no especificación exhaustiva).

#### FORMATO

```
Como [tipo de usuario],
quiero [una acción]
para [obtener un beneficio]
```

**Ejemplo:**
```
Como comprador,
quiero pagar una factura desde el sistema
para no tener que hacer transferencia manual en banco
```

#### Describe la MISMA necesidad que caso de uso "Pagar Factura"
Pero con **MUCHO menos formalismo**.

#### SE COMPLETA CON: CRITERIOS DE ACEPTACIÓN

Condiciones verificables que deben cumplirse para dar por terminada.

Análogo a postcondición de caso de uso.

**Ejemplo:**
```
Criterios de Aceptación:
- El sistema muestra la lista de facturas pendientes
- El usuario puede seleccionar una factura
- El sistema realiza el pago en menos de 2 segundos
- Se envía confirmación por email
```

---

### ESTIMACIÓN EN ÁGIL

**NO se anticipa tiempo/costo en unidades absolutas** como planificación tradicional.

Se estima **TAMAÑO RELATIVO** con unidad abstracta: **PUNTOS DE HISTORIA** (Story Points).

**Combinan:**
- Complejidad
- Volumen de trabajo
- Riesgo percibido

Se compara contra historias ya estimadas.

#### PLANNING POKER (Técnica de Estimación Colaborativa)

1. Cada integrante estima **independiente y simultáneamente** (evita sesgo de anclaje)
2. Equipo **discute** hasta **consenso**
3. Con el tiempo: **calcular VELOCIDAD** (puntos/Sprint) para planificación más realista

## 5.9 — CASOS DE USO 2.0

Guía de Ivar Jacobson (uno de autores del PU y UML) con Ian Spence y Kurt Bittner.

### OBJETIVO

Adaptar y aligerar técnica de casos de uso para contextos iterativos e incluso ágiles **sin perder fortalezas centrales.**

### IDEAS CENTRALES

1. Usar casos de uso **también en proyectos ágiles**
2. Trabajar con **REBANADAS de caso de uso** (desarrollar y entregar porción concreta primero, no esperar completarlo)
3. Organizar trabajo alrededor de **pequeño conjunto de casos de uso esenciales** (similar a cómo PU prioriza casos arquitectónicamente significativos)

### RESULTADO

Punto de encuentro entre **tradición formal de casos de uso** y **filosofía ágil de entrega incremental**.

Ambas comparten preocupación por **capturar y priorizar lo que realmente aporta valor a usuario**.

## 5.10 — EL WORKFLOW DE REQUISITOS EN DETALLE (PROCESO UNIFICADO)

### Actividades del Workflow

#### ACTIVIDAD 1: SÍNTESIS DE REQUERIMIENTOS

**Actor:** Ingeniero de Casos de Uso

**Objetivo:** Recopilar información de múltiples fuentes

**Acciones:**
- Entrevistas con stakeholders
- Revisión de documentación
- Observación de procesos actuales
- Análisis de sistemas heredados

**Produce:** Lista de características candidatas, resumen de necesidades

---

#### ACTIVIDAD 2: CONSTRUIR MODELO DE CASOS DE USO

**Actor:** Ingeniero de Casos de Uso, Arquitecto

**Objetivo:** Estructura funcional del sistema

**Acciones:**
1. Identificar actores (quiénes interactúan con el sistema)
2. Identificar casos de uso (qué funcionalidades)
3. Establecer relaciones entre actores y casos de uso
4. Documentar cada caso de uso (flujo básico y alternados)

**Produce:** Diagrama de casos de uso, descripciones de casos de uso

---

#### ACTIVIDAD 3: ESPECIFICAR REQUISITOS NO FUNCIONALES

**Actor:** Arquitecto, Analista

**Objetivo:** Documentar atributos de calidad, restricciones, etc.

**Acciones:**
- Definir rendimiento esperado
- Definir restricciones de tecnología
- Definir requisitos legales/regulatorios
- Definir disponibilidad requerida
- Definir seguridad

**Produce:** Documento de requisitos no funcionales

---

#### ACTIVIDAD 4: CREAR PROTOTIPOS DE INTERFAZ

**Actor:** Diseñador de Interfaz, Ingeniero de Casos de Uso

**Objetivo:** Validar con usuarios que se entiende correctamente

**Acciones:**
- Diseñar pantallas principales
- Mostrar a usuarios
- Recolectar retroalimentación
- Refinar basado en feedback

**Produce:** Prototipos de interfaz de usuario

---

#### ACTIVIDAD 5: INSPECCIONAR REQUERIMIENTOS

**Actor:** Equipo de Revisión (incluye QA)

**Objetivo:** Encontrar problemas ANTES de diseño

**Acciones:**
- Revisar completitud (¿Falta algo?)
- Revisar consistencia (¿Hay contradicciones?)
- Revisar ambigüedad (¿Se entiende igual todos?)
- Revisar verificabilidad (¿Se puede probar?)

**Produce:** Reporte de revisión, lista de defectos

---

### Artefactos del Workflow de Requisitos

#### 1. LISTA DE CARACTERÍSTICAS

- Reúne buenas ideas de clientes, usuarios, analistas, desarrolladores
- Antes de que se conviertan en requisitos formales
- Se usa para planificar iteraciones

**Atributos:**
- Nombre corto
- Explicación breve
- Estado (propuesta/aprobada/incluida/validada)
- Costo estimado
- Prioridad
- Nivel de riesgo

---

#### 2. MODELO DE CASOS DE USO (Principal)

- Representa requisitos funcionales
- Compuesto por actores y casos de uso
- El diagrama muestra relaciones

---

#### 3. DESCRIPCIÓN DE LA ARQUITECTURA (Vista de Casos de Uso)

- Identifica qué casos de uso son ARQUITECTÓNICAMENTE SIGNIFICATIVOS
- Aquellos que guían el diseño de la arquitectura

---

#### 4. GLOSARIO

- Fija vocabulario común
- Evita que la misma palabra signifique dos cosas en dos documentos
- **Crítico para comunicación** entre cliente y equipo

---

#### 5. PROTOTIPO DE INTERFAZ DE USUARIO

- Valida con usuarios lo que descripciones textuales no pueden transmitir
- La herramienta más potente de validación

---

#### 6. LISTA DE REQUISITOS ADICIONALES

- Requisitos no funcionales
- Restricciones de plataforma
- Requisitos legales
- TODO lo que no encaja naturalmente en un caso de uso

**Importancia:** Si todo fuera caso de uso, quedarían afuera cosas críticas:
- 500 usuarios concurrentes
- Normativa de datos
- Plataforma específica

---

### Estructura Detallada de un Caso de Uso

**PASOS PARA DETALLAR:**

1. Elegir un **CAMINO BÁSICO COMPLETO** (el camino "normal", el que el usuario percibe más habitual, el que aporta valor más obvio)

2. Describirlo en una sección propia

3. Después, describir los **CAMINOS ALTERNATIVOS** como desviaciones del básico

**ELEMENTOS MÍNIMOS:**

- **PRECONDICIÓN:** Estado inicial
- Cómo y cuándo comienza
- Orden de acciones (numeradas)
- Cómo y cuándo termina
- **POSTCONDICIÓN:** Posibles estados finales
- Caminos no permitidos
- Caminos alternativos
- **REQUISITOS ESPECIALES:** No funcionales propios de ese caso de uso

**PUNTO CLAVE:** La técnica de flujo básico + alternativos es para no perderse en la complejidad de todos los caminos posibles.

#### EJEMPLO: Caso de Uso "Pagar Factura"

```
Precondición: Comprador ha recibido bienes y al menos una factura

Flujo Básico:
  1. Comprador invoca operación para hojear facturas
  2. Sistema verifica consistencia con confirmaciones de pedido
  3. Comprador planifica factura para pagar por banco
  4. Sistema genera petición de pago
  5. Si hay dinero suficiente, realiza pago
     (usando caso de uso abstracto "Realizar Transacción")
  6. Notifica a comprador y vendedor

Caminos Alternativos:
  - En paso 3: Comprador puede rechazar factura
  - En paso 5: Si no hay dinero, cancela pago

Postcondición: Factura pagada o pago cancelado

Requisitos Especiales:
  - El pago debe procesarse en menos de 2 segundos
  - Debe mantener registro de auditoría
```

---

### El Modelo de Requerimientos: Síntesis

**TABLA SÍNTESIS:**

| ACTIVIDAD | ARTEFACTO |
|-----------|-----------|
| Enumerar requisitos candidatos | LISTA DE CARACTERÍSTICAS |
| Entender contexto del sistema | MODELO DE DOMINIO o MODELO DE NEGOCIO |
| Capturar requisitos funcionales | MODELO DE CASOS DE USO |
| Capturar requisitos no funcionales | LISTA DE REQUISITOS ADICIONALES |
| Validar con usuarios | PROTOTIPOS DE INTERFAZ |
| Vocabulario común | GLOSARIO |

El conjunto de **TODOS estos artefactos** = **MODELO DE REQUERIMIENTOS COMPLETO**

Base sobre la que se apoyan después análisis y diseño.

## 5.11 — CASOS DE USO EN UML

### Precisión Importante

Un caso de uso **NO describe UNA secuencia** de acciones.

**Describe UN CONJUNTO DE SECUENCIAS.**

Cada secuencia concreta, cada camino a través del caso de uso = **ESCENARIO**

### RELACIÓN (Analogía Textual)

```
Escenario es a Caso de Uso como INSTANCIA es a CLASE
```

**Escenario** = una INSTANCIA del caso de uso

### EFECTO DE EXPANSIÓN (Muy Importante)

- Sistema moderadamente complejo = pocas decenas de casos de uso
- Pero cada caso de uso = puede expandirse en varias decenas de escenarios

**Dentro de escenarios:**
- PRINCIPALES: Definen secuencias esenciales
- SECUNDARIOS: Definen secuencias alternativas

### CONSECUENCIA PRÁCTICA

Si derivás casos de prueba de casos de uso, **no derivás uno por caso de uso.**

**Derivás UNO POR ESCENARIO.**

Por eso las pruebas se multiplican tan rápido y por eso hay que priorizar también las pruebas.

---

### Las Tres Relaciones entre Casos de Uso

**Propósito:** FACTORIZAR comportamiento (evitar repetición) y FACTORIZAR VARIANTES (sacar lo condicional)

#### RELACIÓN 1: INCLUSIÓN (include)

- **Significado:** Un caso de uso BASE incorpora **EXPLÍCITAMENTE** el comportamiento de otro
- **Cuándo:** En un lugar **DETERMINADO** de su flujo
- **Características:** El comportamiento incluido **SIEMPRE se ejecuta** (no es opcional)
- **Notación:** Dependencia con estereotipo `<<include>>`, flecha desde BASE hacia INCLUIDO

**Propósito:** Evitar repetir el mismo texto en muchos casos de uso

**Ejemplo:** "Hacer pedido" incluyendo "Validar usuario" — no hay manera de hacer pedido sin validar, siempre pasa

---

#### RELACIÓN 2: EXTENSIÓN (extend)

- **Significado:** Un caso de uso BASE incorpora **IMPLÍCITAMENTE** el comportamiento de otro
- **Cuándo:** En un lugar especificado **INDIRECTAMENTE** por quien extiende
- **Características:** El caso BASE no sabe que está siendo extendido, puede ejecutarse solo
  - El BASE declara PUNTOS DE EXTENSIÓN (lugares nombrados donde otro puede insertarse **SI SE CUMPLE CONDICIÓN**)
- **Notación:** Dependencia con estereotipo `<<extend>>`, flecha desde EXTIENDE hacia BASE

**Propósito:** Factorizar VARIANTES (comportamiento solo bajo condición)

**Ejemplo:** "Hacer pedido" tiene punto de extensión "establecer prioridad". Si es pedido urgente, "Hacer pedido urgente" se inserta ahí; si no, el flujo normal continúa

---

#### RELACIÓN 3: GENERALIZACIÓN (Herencia)

- Funciona igual que entre clases: subclase hereda comportamiento del padre y puede especializarlo
- Se usa cuando hay varias maneras alternativas de lograr el mismo objetivo

**Ejemplo:** "Cobrar pedido" con hijos "Cobrar en efectivo" y "Cobrar con tarjeta"

---

### Regla Mnemotécnica para Examen

- **INCLUSIÓN:** Comportamiento SIEMPRE ocurre, BASE LO LLAMA EXPLÍCITAMENTE
- **EXTENSIÓN:** Comportamiento ocurre SOLO BAJO CONDICIÓN, BASE NI SE ENTERA
- **GENERALIZACIÓN:** HERENCIA Y ESPECIALIZACIÓN

---

### Casos de Uso y Colaboraciones

**IDEA CLAVE (Conecta con arquitectura):**

- Un caso de uso **captura QUÉ debe hacer el sistema** (requisito funcional sin especificar cómo se implementa)
- Esta separación es deliberada e importante: el análisis de qué debe hacer el sistema no debería estar contaminado por decisiones de cómo hacerlo

**Pero en algún momento hay que cerrar esa brecha:**

**REALIZACIÓN:** Cada caso de uso se realiza mediante una **COLABORACIÓN**
- = un conjunto de clases y objetos que trabajan juntos
- Para producir el comportamiento descripto

---

### FRASE ORO (Resume el Rol del Arquitecto)

"El objetivo de la arquitectura de un sistema es encontrar el conjunto **MÍNIMO de colaboraciones BIEN ESTRUCTURADAS** que satisfacen el **flujo de eventos especificado en TODOS los casos de uso del sistema**"

## 5.12 — ANÁLISIS DE CONSISTENCIA ENTRE MODELOS (Detalle)

**PUNTO CLAVE (no aparecía en el libro anterior):** Parte de validación consiste en verificar que los **modelos no se contradigan** entre sí.

### Modelos que Deben Ser Consistentes

| Modelo | Qué Representa |
|--------|----------------|
| **Modelo de Casos de Uso** | Qué funciones ofrece el sistema |
| **Modelo de Dominio** | Qué conceptos/objetos existe el negocio |
| **Diagrama de Clases** | Cómo se estructura el sistema |
| **Prototipos de Interfaz** | Cómo usuario interactúa |
| **ERS** | Qué dice formalmente que hace |

### Inconsistencias Típicas

#### INCONSISTENCIA 1: Caso de Uso vs Modelo de Dominio

**Problema:**
- Caso de Uso dice: "Usuario paga con Tarjeta de Crédito"
- Modelo de Dominio NO tiene clase "TarjetadeCredito"

**Impacto:** Implementación no sabrá cómo modelar el concepto

**Corrección:** Agregar "TarjetadeCredito" al modelo de dominio con atributos (número, vencimiento, tipo)

---

#### INCONSISTENCIA 2: Flujo de Caso de Uso vs Prototipo de Interfaz

**Problema:**
- Caso de Uso dice: "Sistema solicita confirmación de pago"
- Prototipo muestra: Pantalla que NO tiene botón "Confirmar"

**Impacto:** Caso de uso no se puede ejecutar como se describió

**Corrección:** Agregar botón o cambiar descripción del caso de uso

---

#### INCONSISTENCIA 3: Atributo en Modelo vs ERS

**Problema:**
- ERS dice: "Dirección del cliente es obligatoria"
- Modelo de Dominio muestra: Cliente.direccion **sin restricción**

**Impacto:** Código se deja programar de forma que permite cliente SIN dirección

**Corrección:** Marcar Cliente.direccion como [0..1] no, [1..1] sí (requerido)

---

### Proceso de Verificación

**TÉCNICA:** Lectura de Documento + Diagramas en Equipo

1. **Tomar CADA funcionalidad** de casos de uso
2. **Verificar que existe en modelo de dominio**
3. **Verificar que existe en diagrama de clases**
4. **Verificar que aparece en interfaz (prototipo)**
5. **Verificar que está documentada en ERS**

**Si falta en alguno → Inconsistencia → Defecto**

## Unidad I: Introducción a la Ingeniería de Software

- **Software = conjunto completo** (código + datos + config + docs)
- **Se DESARROLLA, no manufactura**
- **NO se desgasta pero SÍ se deteriora** (el piso sube con cambios)
- **Atributos de calidad COMPITEN entre sí**
- **Mantenimiento = fase más larga y cara**
- **Ingeniería = sistemático + disciplinado + CUANTIFICABLE**
- **Crisis = entrega tarde, costoso, incorrecto, frágil, pobre calidad**
- **Ley de Brooks:** agregar gente a proyecto atrasado lo atrasa más
- **Cambio tardío cuesta 50-100 veces más**
- **Proceso = MARCO** (no checklist) que se especializa por proyecto

## Unidad II: Paradigma Orientado a Objetos

- **Abstracción:** quedarse con lo esencial según el propósito
- **Encapsulamiento:** separar interfaz de implementación
- **Modularidad:** cohesión fuerte, acoplamiento débil
- **Jerarquía:** ordenación de abstracciones (herencia, agregación)
- **Clases:** moldes; Instancias: objetos concretos
- **Relaciones:** asociación, agregación, composición, herencia, dependencia, realización

## Unidad III: Procesos de Desarrollo y Enfoques Ágiles

- **Proceso = marco** que define quién hace qué, en qué orden, con qué entradas, produciendo qué resultados
- **Cascada:** fases secuenciales, rígido
- **Iterativo:** ciclos cortos, flexible
- **CBSE:** reutilización de componentes
- **Proceso Unificado** = especialización del iterativo
- **Manifiesto Ágil:** individuos, software funcionando, colaboración, cambio
- **Scrum:** roles (Developers, PO, SM), eventos (planning, daily, review, retro), artefactos (backlog, sprint backlog, increment)
- **Lean:** eliminar desperdicio, aprender, decidir tarde, entregar rápido

## Unidad IV: Proceso Unificado

- **Fases (TIEMPO):** Inicio (viabilidad), Elaboración (factibilidad, línea base arq.), Construcción (funcionalidad), Transición (producción)
- **Flujos (TIPO):** Requisitos, Análisis, Diseño, Implementación, Prueba (repiten en cada iteración)
- **Proporción de esfuerzo:** En cada fase cambia la proporción de cada flujo, pero todos están presentes
- **Trabajador = ROL** (no persona)
- **Artefacto = PRODUCTO** (modelo, documento, componente)
- **Primer Pilar:** Dirigido por Casos de Uso (hilo conductor de todo)
- **Segundo Pilar:** Centrado en la Arquitectura (decisión estratégica de alto nivel)

## Unidad V: Ingeniería de Requerimientos

- **Requisitos funcionales:** QUÉ (especificados por casos de uso)
- **Requisitos no funcionales:** CÓMO (atributos de calidad)
- **Los 5 procesos:** Elicitación → Análisis → Especificación → Validación → Administración
- **Elicitación:** Entrevistas, observación, talleres, prototipos, documentación
- **Especificación:** Documento ERS (completo, consistente, no ambiguo, verificable, trazable, modificable)
- **Validación:** Revisiones, casos de prueba derivados, prototipos de interfaz
- **Administración:** Gestionar cambios manteniendo trazabilidad
- **User Stories** (ágil): "Como X, quiero Y para Z" + criterios de aceptación
- **Puntos de Historia:** Estimación relativa de tamaño
- **Caso de Uso:** Camino básico + caminos alternativos
- **Escenarios:** Instancias concretas de un caso de uso
- **Relaciones CU:** Inclusión (siempre), Extensión (bajo condición), Generalización (herencia)
